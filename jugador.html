<div class="shell">

  <header class="topbar">

    <div class="micro-meta" id="microMeta"></div>
  </header>

  <div class="layout">
  <nav class="bottomnav" id="nav" aria-label="Secciones">
    <button class="navitem is-active" data-screen="sesion" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v3H4Zm0 5.5h16v3H4Zm0 5.5h16v3H4Z" fill="currentColor"/></svg>
