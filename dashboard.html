<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carga GPS · Dashboard</title>
<meta name="description" content="Dashboard analítico de carga GPS: evolución, microciclos, tipo de sesión, jugadores, comparador y lesionados.">
<meta name="theme-color" content="#16305f">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/icon-192.png?v=53">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f6; --surface-3:#e7ebf2;
    --border:#dde3ec; --border-strong:#c9d1de;
    --ink:#1a2130; --ink-2:#576078; --ink-3:#8a92a6;
    --accent:#16305f; --accent-2:#1d5fd4; --on-accent:#ffffff;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#e34948;
    --sem-corto:#5b9bd5; --sem-ok:#1baf7a; --sem-pasado:#eda100; --sem-alto:#e34948; --sem-na:#c4cad6;
    --band:rgba(27,175,122,.12);
    --shadow:0 1px 2px rgba(20,30,55,.06), 0 8px 24px -12px rgba(20,30,55,.14);
    --r:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0d121c; --surface:#151d2b; --surface-2:#1c2536; --surface-3:#232d40;
      --border:#2a3446; --border-strong:#3a4557;
      --ink:#e8ecf5; --ink-2:#9aa5bc; --ink-3:#6c7690;
      --accent:#3a5c94; --accent-2:#6ea8ff; --on-accent:#ffffff;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#e66767;
      --sem-corto:#4a86c4; --sem-ok:#199e70; --sem-pasado:#c98500; --sem-alto:#e05656; --sem-na:#3a4557;
      --band:rgba(25,158,112,.16);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0d121c; --surface:#151d2b; --surface-2:#1c2536; --surface-3:#232d40;
    --border:#2a3446; --border-strong:#3a4557;
    --ink:#e8ecf5; --ink-2:#9aa5bc; --ink-3:#6c7690;
    --accent:#3a5c94; --accent-2:#6ea8ff; --on-accent:#ffffff;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#e66767;
    --sem-corto:#4a86c4; --sem-ok:#199e70; --sem-pasado:#c98500; --sem-alto:#e05656; --sem-na:#3a4557;
    --band:rgba(25,158,112,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Barlow Condensed", "Barlow", sans-serif; font-weight:600; margin:0; line-height:1.1; text-wrap:balance}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
  .v-real{font-size:14.5px; font-weight:700; color:var(--ink)}
  .v-obj{color:var(--ink-3); font-weight:400}
  button{font-family:inherit; cursor:pointer}
  a{color:var(--accent-2)}
  :focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:4px}

  .wrap{max-width:1180px; margin:0 auto; padding:0 20px}

  /* ---- header ---- */
  header{background:var(--accent); color:var(--on-accent)}
  .head-in{display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:18px 0 16px; flex-wrap:wrap}
  .brand{display:flex; align-items:baseline; gap:12px}
  .brand h1{font-size:26px; letter-spacing:.5px; text-transform:uppercase; color:#fff}
  .brand .sub{font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.72)}
  .kpis{display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; margin:-8px 0 0}
  .kpi{background:var(--surface); padding:12px 14px}
  .kpi .n{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:26px; letter-spacing:.5px}
  .kpi .l{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-top:1px}
  .kpi .n small{font-size:13px; font-weight:600; color:var(--ink-2); letter-spacing:0}

  /* ---- filter bar ---- */
  .filters{position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); margin-top:16px}
  @supports (backdrop-filter:blur(1px)){ .filters{background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(8px)} }
  .filters-in{display:flex; flex-wrap:wrap; gap:14px 22px; padding:11px 0}
  .fgroup{display:flex; flex-direction:column; gap:4px}
  .fgroup > span{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
  .chips{display:flex; gap:4px; flex-wrap:wrap}
  .chip{border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-2); border-radius:999px; padding:3px 10px; font-size:12.5px; font-weight:500; line-height:1.4; transition:border-color .1s, color .1s}
  .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
  .chip:not([aria-pressed="true"]):hover{border-color:var(--accent-2); color:var(--ink)}
  .chip:disabled{opacity:.4; cursor:not-allowed}
  .chip:disabled:hover{border-color:var(--border-strong); color:var(--ink-2)}
  .chip.sm{padding:2px 8px; font-size:11.5px}
  select{font-family:inherit; font-size:12.5px; padding:4px 8px; border:1px solid var(--border-strong); border-radius:7px; background:var(--surface); color:var(--ink)}

  /* ---- tabs ---- */
  .tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin:18px 0 0; overflow-x:auto}
  .tab{border:0; background:transparent; color:var(--ink-2); font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:15.5px; letter-spacing:.04em; text-transform:uppercase; padding:9px 14px; border-bottom:2.5px solid transparent; white-space:nowrap; transition:color .1s, border-color .1s}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent-2)}

  main{padding:20px 0 60px}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow)}
  .panel-h{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:14px 16px 8px}
  .panel-h h2{font-size:19px}
  .panel-h p{margin:2px 0 0; font-size:12.5px; color:var(--ink-2); max-width:62ch}
  .legend{display:flex; gap:12px; flex-wrap:wrap; padding:4px 16px 12px; font-size:12px; color:var(--ink-2)}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px}
  .legend .ln{width:16px; height:0; border-top-width:2.5px; border-top-style:solid; border-radius:0; vertical-align:4px}

  .chart-box{position:relative; padding:0 6px 10px}
  svg{display:block; width:100%; height:auto; overflow:visible}
  .grid line{stroke:var(--border)}
  .axis text{fill:var(--ink-3); font-size:10.5px}
  .axis-lab{fill:var(--ink-2); font-size:11px; font-weight:500}
  .mcband{fill:var(--surface-2)}
  .mclab{fill:var(--ink-3); font-size:10px; font-weight:600; letter-spacing:.06em}
  .serie{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
  .serie.team{stroke:var(--ink); stroke-width:2.6}
  .band-fill{fill:var(--band)}
  .band-line{stroke:var(--ink-3); stroke-dasharray:3 3; stroke-width:1.3; fill:none}

  .tt{position:absolute; pointer-events:none; z-index:5; background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; box-shadow:var(--shadow); padding:8px 10px; font-size:12px; min-width:150px; opacity:0; transition:opacity .1s}
  .tt h4{font-family:"Barlow Condensed",sans-serif; font-size:13.5px; margin-bottom:4px; display:flex; justify-content:space-between; gap:10px}
  .tt .row{display:flex; justify-content:space-between; gap:12px; color:var(--ink-2)}
  .tt .row b{color:var(--ink); font-weight:600}
  .tt .row i{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:5px}

  .crosshair{stroke:var(--border-strong); stroke-width:1}
  .dot{stroke:var(--surface); stroke-width:1.5}

  table{border-collapse:collapse; width:100%; font-size:12.5px}
  th,td{text-align:right; padding:5px 9px; border-bottom:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  thead th{font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr.total{font-weight:700}
  tbody tr.total td{background:var(--surface-2); border-top:2px solid var(--border-strong)}
  .tbl-scroll{overflow-x:auto; padding:2px 16px 16px}
  .tbl-scroll.sticky-col th:first-child,.tbl-scroll.sticky-col td:first-child{position:sticky; left:0; background:var(--surface); z-index:1}
  .tbl-scroll.sticky-col tbody tr:hover td:first-child{background:var(--surface-2)}
  .tbl-scroll.sticky-col tbody tr.total td:first-child{background:var(--surface-2)}
  .grp-start{border-left:1px solid var(--border)}
  .badge-pend{display:inline-block; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-3); font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; vertical-align:1px}
  .badge-warn{display:inline-block; padding:2px 8px; border-radius:999px; background:var(--sem-pasado); color:#fff; font-size:11px; font-weight:700; letter-spacing:.02em; vertical-align:1px}

  .hm-cell{cursor:pointer; transition:transform .08s}
  .hm-cell:hover{transform:scale(1.04)}
  .hm-val{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500}

  .mini-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin:0 16px 14px}
  .mini-kpis .kpi{padding:10px 12px}
  .mini-kpis .kpi .n{font-size:19px}
  .split{display:grid; grid-template-columns:1.35fr 1fr; gap:16px}
  .sub-h{font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:14px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2); margin:0 0 8px}
  .pick{display:flex; flex-wrap:wrap; gap:4px; padding:0 16px 12px}
  .muted{color:var(--ink-3); font-size:12px}
  .note{font-size:11.5px; color:var(--ink-3); padding:0 16px 14px}
  .pos-D{color:var(--s1)} .pos-M{color:var(--s3)} .pos-DL{color:var(--s2)}
  .bajas{border-top:1px dashed var(--border-strong); padding-top:12px; margin-top:2px}
  .tag-les{display:inline-block; white-space:nowrap; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.03em}
  .tag-les.baja{background:color-mix(in srgb, var(--sem-alto) 18%, transparent); color:var(--sem-alto)}
  .tag-les.rehab{background:color-mix(in srgb, var(--sem-pasado) 20%, transparent); color:var(--sem-pasado)}
  .tag-les.alta{background:color-mix(in srgb, var(--sem-ok) 18%, transparent); color:var(--sem-ok)}
  details.les{border-top:1px solid var(--border)}
  details.les > summary{list-style:none; cursor:pointer; display:grid; grid-template-columns:minmax(150px,1.4fr) minmax(120px,1.2fr) 1fr 1fr auto; gap:10px; align-items:center; padding:11px 16px}
  details.les > summary::-webkit-details-marker{display:none}
  details.les > summary:hover{background:var(--surface-2)}
  details.les > summary .nm{font-weight:600}
  details.les > summary .nm::before{content:"▸"; display:inline-block; width:14px; color:var(--ink-3); transition:transform .12s}
  details.les[open] > summary .nm::before{transform:rotate(90deg)}
  details.les > summary .lb{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); display:block}
  .les-body{padding:4px 0 10px; background:var(--surface)}
  .les-pick{display:flex; flex-wrap:wrap; gap:10px 22px; padding:4px 16px 10px}
  .chip .sw{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:0}
  .ref-line{stroke:var(--ink-3); stroke-dasharray:4 3; stroke-width:1.2}
  .les-h{font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2); padding:14px 16px 6px; margin:0}

  @media (max-width:820px){
    .les-pick{display:flex; flex-wrap:wrap; gap:10px 22px; padding:4px 16px 10px}
  .chip .sw{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:0}
  .sm-grid{grid-template-columns:repeat(2,1fr)}
    details.les > summary{grid-template-columns:1fr 1fr; row-gap:4px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .split{grid-template-columns:1fr}
    .brand h1{font-size:22px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div class="brand">
      <h1>Carga GPS</h1>
      <span class="sub" id="season-lab">AT Baleares</span>
    </div>
    <span class="sub" id="gen-lab"></span>
  </div>
</header>

<div class="wrap" style="margin-top:-10px; position:relative; z-index:2">
  <div class="kpis" id="kpis"></div>
</div>

<div class="filters">
  <div class="wrap filters-in" id="filters"></div>
</div>

<div class="wrap">
  <div class="tabs" id="tabs" role="tablist"></div>
</div>

<main class="wrap" id="view"></main>

<script src="data.js?v=53"></script>
<script>
"use strict";
function buildRAW(d){
  const METR=["distancia","hmld","hsr","sprint","acc","dec"];
  function dur2min(t){
    if(typeof t==="number") return t;          // desde M10 la duración ya va en minutos
    if(typeof t==="string" && t.indexOf(":")<0 && isFinite(parseFloat(t))) return parseFloat(t);
    if(!t || typeof t!=="string" || t.indexOf(":")<0) return null;
    const p=t.split(":").map(Number);
    if(p.length===3) return Math.round((p[0]*60+p[1]+p[2]/60)*10)/10;
    if(p.length===2) return Math.round((p[0]+p[1]/60)*10)/10;
    return null;
  }
  // el club ya calcula su propia fila "MEDIA EQUIPO" (teamAvg) por sesión/partido — la
  // reempaquetamos con la misma forma que un jugador ({d,dur,vmax,pl,m}) para poder leerla
  // con las mismas raw()/normalize() y así no reinventar (ni desviarnos de) su cálculo oficial.
  function teamAvgShape(ta){
    if(!ta) return null;
    const mp={};
    METR.forEach(k=>{ const v=ta[k]; if(v && typeof v==="object") mp[k]=[(v.obj===undefined?null:v.obj), (v.real===undefined?null:v.real)]; });
    return {d:null, dur:dur2min(ta.duracion), vmax:(ta.velMax===undefined?null:ta.velMax), pl:(ta.playerLoad===undefined?null:ta.playerLoad), m:mp};
  }
  const players={};
  d.refPartido.players.forEach(p=>{ players[p.dorsal]={d:p.dorsal,n:p.jugador,g:p.grupo}; });
  const ref={};
  d.refPartido.players.forEach(p=>{
    const o={}; METR.concat(["velMax"]).forEach(k=>{ o[k]=(p[k]===undefined?null:p[k]); }); ref[p.dorsal]=o;
  });
  const sessions=[], extras=[];
  d.microciclos.slice().reverse().forEach(mk=>{
    const m=d[mk], meta=m.meta;
    m.orden.forEach(o=>{
      const key=o.key, isMatch=(o.tipo!=="sesion");
      const src=isMatch? m.partidos[key] : m.sesiones[key];
      const row={mc:meta.n, mcTipo:meta.tipo, key:key, date:src.date,
        role: src.role || (isMatch?"Partido":null),
        isMatch:isMatch, rival:(src.rival||null), estado:meta.estado, semana:meta.semana,
        estimado:!!src.estimado, teamAvg:teamAvgShape(src.teamAvg), players:[]};
      src.players.forEach(pl=>{
        const dd=pl.dorsal;
        if(!players[dd]) players[dd]={d:dd,n:(pl.jugador||"?"),g:(pl.grupo||"?")};
        const mp={};
        METR.forEach(k=>{ const v=pl[k]; if(v && typeof v==="object") mp[k]=[(v.obj===undefined?null:v.obj), (v.real===undefined?null:v.real)]; });
        row.players.push({d:dd, e:(pl.estado||null), dur:dur2min(pl.duracion), vmax:(pl.velMax===undefined?null:pl.velMax), pl:(pl.playerLoad===undefined?null:pl.playerLoad), m:mp});
      });
      sessions.push(row);
    });
    // sesiones Extra (fuera de calendario): solo para la pestaña Lesionados, no entran en el resto
    Object.entries(m.extras||{}).forEach(([key,src])=>{
      const row={mc:meta.n, key:key.replace("_"," "), date:src.date, isExtra:true, players:[]};
      src.players.forEach(pl=>{
        const mp={};
        METR.forEach(k=>{ const v=pl[k]; if(v && typeof v==="object") mp[k]=[null, (v.real===undefined?null:v.real)]; });
        row.players.push({d:pl.dorsal, e:"extra", dur:dur2min(pl.duracion), vmax:(pl.velMax===undefined?null:pl.velMax), pl:(pl.playerLoad===undefined?null:pl.playerLoad), m:mp});
      });
      extras.push(row);
    });
  });
  const playerList=Object.keys(players).map(k=>players[k]).sort((a,b)=>a.d-b.d);
  return {
    meta:d.meta,
    players:playerList,
    ref:ref, refTeam:d.refPartido.teamAvg,
    coef:d.coeficientes.tipos, sessions:sessions,
    extras:extras.sort((a,b)=>a.date<b.date?-1:1), lesiones:(d.lesiones||[]),
  };
}
const RAW = buildRAW(window.GPS_DATA_ALL);

/* ---------- model ---------- */
const METRICS = {
  distancia:{lab:"Distancia", u:"m", dec:0},
  hmld:{lab:"HMLD", u:"m", dec:0},
  hsr:{lab:"HSR", u:"m", dec:0},
  sprint:{lab:"Sprints", u:"", dec:1},
  acc:{lab:"Aceleraciones", u:"", dec:1},
  dec:{lab:"Deceleraciones", u:"", dec:1},
  pl:{lab:"Player Load", u:"ua", dec:0, noObj:true},
  vmax:{lab:"Vel. máx", u:"km/h", dec:1, noObj:true, best:true},
};
const RADAR_METRICS = ["distancia","hmld","hsr","sprint","acc","dec"];
const NORMS = {
  abs:{lab:"Absoluto"},
  permin:{lab:"Por minuto"},
  pctobj:{lab:"% objetivo"},
  pctref:{lab:"% ref. partido"},
};
const GROUPS = {D:"DEF", M:"MED", DL:"DEL"};
const SERIES_COLORS = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];

// Los microciclos 1-7 fueron pretemporada: aunque el Excel etiquete sus sesiones
// como MD-4/MD-3/..., NO cuentan como tal (contexto y demandas distintos).
const PRESEASON_MC = 7;
// normalize the raw session role into a training-day bucket
function bucket(s){
  if(s.isMatch) return "Partido";
  if(s.mc <= PRESEASON_MC) return "Pretemp.";
  const r=(s.role||"").toUpperCase();
  if(r.startsWith("MD+") || r.includes("+1")) return "MD+1";
  if(r.startsWith("MD-")) return r;
  return "Otras";
}
const BUCKET_ORDER = ["MD+1","MD-4","MD-3","MD-2","MD-1","Partido","Otras","Pretemp."];

RAW.sessions.forEach((s,i)=>{ s.i=i; s.bucket=bucket(s); });
const PLAYERS = RAW.players;
const NAME = Object.fromEntries(PLAYERS.map(p=>[p.d, p.n]));
const POS = Object.fromEntries(PLAYERS.map(p=>[p.d, p.g]));
const REF = RAW.ref;
const MICROS = [...new Set(RAW.sessions.map(s=>s.mc))].sort((a,b)=>a-b);

/* ---------- lesiones ---------- */
// una lesión va de la baja (incluida) al alta = primer día de vuelta full (excluido)
const LESIONES = RAW.lesiones;
const HOY = RAW.meta.generado ? RAW.meta.generado.slice(0,10) : new Date().toISOString().slice(0,10);
function lesionEn(dorsal, date){
  return LESIONES.find(l=> l.dorsal===dorsal && l.baja<=date && (!l.alta || date<l.alta)) || null;
}
function diasEntre(a,b){ return Math.round((Date.parse(b)-Date.parse(a))/86400000); }
// fuera de la tabla del equipo en la pestaña Sesión: de baja ese día o en rehab
const esBaja = (pr, s) => pr.e==="rehab" || !!lesionEn(pr.d, s.date);

/* ---------- state ---------- */
const state = {
  metric:"distancia", norm:"abs", group:"all",
  buckets:new Set(BUCKET_ORDER),
  players:new Set(),          // evolución overlay + comparador
  lens:"evolucion",
  hmPlayer:null,
  session:null,                // índice (RAW.sessions[i].i) de la sesión elegida en la pestaña Sesión
  acuMc:null, acuRef:null,     // pestaña Microciclos: microciclo y referencia del "Acumulado de la semana"
};

/* ---------- value helpers ---------- */
function raw(pr, metric){
  if(metric==="pl") return {real:pr.pl, obj:null};
  if(metric==="vmax") return {real:pr.vmax, obj:null};
  const m=pr.m[metric]; return m? {obj:m[0], real:m[1]} : {obj:null, real:null};
}
// partidos OFICIALES = liga (clave "Jx"); los PTx de pretemporada no cuentan aquí
const isOficial = s => s.isMatch && /^J\d/.test(s.key);
const officialMatches = () => RAW.sessions.filter(isOficial);
// suma/media/mejor de un parámetro entre los jugadores que jugaron ese partido
function matchStat(s, metric){
  let sum=0, n=0, best=null;
  s.players.forEach(pr=>{
    const v=raw(pr,metric).real;
    if(v!=null && isFinite(v)){ sum+=v; n++; if(best==null||v>best) best=v; }
  });
  return n? {sum, mean:sum/n, n, best} : {sum:null, mean:null, n:0, best:null};
}
function refVal(dorsal, metric){
  const r=REF[dorsal]; if(!r) return null;
  return r[metric==="vmax"?"velMax":metric] ?? null;
}
function normalize(val, kind, pr, metric){
  if(val==null) return null;
  if(kind==="abs") return val;
  if(kind==="permin") return pr.dur ? val/pr.dur : null;
  if(kind==="pctobj"){ const o=raw(pr,metric).obj; return o ? val/o*100 : null; }
  if(kind==="pctref"){ const r=refVal(pr.d,metric); return r ? val/r*100 : null; }
}
const inGroup = pr => state.group==="all" || pr.g===state.group || POS[pr.d]===state.group;

// mean of a per-session team value (real, normalized). Cuando se pide el equipo completo
// (sin filtro de grupo ni subconjunto de jugadores) y la sesión trae su propia fila oficial
// "MEDIA EQUIPO" (teamAvg, calculada por el club/import_data.py), se usa esa cifra
// directamente en vez de recalcularla promediando a mano: el club aplica su propia regla
// de inclusión (p.ej. excluye jugadores en rehabilitación sin objetivo ese día) y un
// promedio ingenuo sobre real!=null diverge de esa cifra oficial en bastantes sesiones.
function teamPoint(s, metric, kind, dorsalSet){
  if(!dorsalSet && state.group==="all" && s.teamAvg && kind!=="pctref"){
    const v=raw(s.teamAvg,metric).real;
    if(v!=null) return normalize(v, kind, s.teamAvg, metric);
  }
  let sum=0,n=0;
  for(const pr of s.players){
    if(dorsalSet){ if(!dorsalSet.has(pr.d)) continue; }
    else if(!inGroup(pr)) continue;
    const v=normalize(raw(pr,metric).real, kind, pr, metric);
    if(v!=null && isFinite(v)){ sum+=v; n++; }
  }
  return n? sum/n : null;
}
function teamObj(s, metric, kind){
  if(METRICS[metric].noObj) return null;
  if(state.group==="all" && s.teamAvg && kind!=="pctref"){
    const o=raw(s.teamAvg,metric).obj;
    if(o!=null){
      if(kind==="abs") return o;
      if(kind==="permin") return s.teamAvg.dur? o/s.teamAvg.dur : null;
      if(kind==="pctobj") return 100;
    }
  }
  let sum=0,n=0;
  for(const pr of s.players){
    if(!inGroup(pr)) continue;
    const o=raw(pr,metric).obj; if(o==null) continue;
    let v=o;
    if(kind==="permin") v = pr.dur? o/pr.dur : null;
    else if(kind==="pctobj") v=100;
    else if(kind==="pctref"){ const r=refVal(pr.d,metric); v=r? o/r*100 : null; }
    if(v!=null && isFinite(v)){ sum+=v; n++; }
  }
  return n? sum/n : null;
}
function playerPoint(s, dorsal, metric, kind){
  const pr=s.players.find(p=>p.d===dorsal);
  if(!pr) return null;
  return normalize(raw(pr,metric).real, kind, pr, metric);
}
function activeSessions(){
  return RAW.sessions.filter(s=>state.buckets.has(s.bucket));
}
function sessionLabel(s){
  const tag = s.isMatch ? (isOficial(s)?"Oficial":"Amistoso") : s.bucket;
  const rival = s.rival? " vs "+s.rival : "";
  return s.key+rival+" · "+tag+" · M"+s.mc+" ("+s.date.slice(5)+")";
}
function sessionHasData(s){
  return s.players.some(pr=> RADAR_METRICS.some(k=>raw(pr,k).real!=null) || pr.pl!=null || pr.vmax!=null);
}

/* ---------- formatting ---------- */
const fmt = (v,m)=> v==null ? "–" : new Intl.NumberFormat("es-ES",{maximumFractionDigits:METRICS[m]?.dec ?? 0}).format(v);
const fmtN = (v,d=0)=> v==null||!isFinite(v) ? "–" : new Intl.NumberFormat("es-ES",{maximumFractionDigits:d}).format(v);
function unitLabel(){
  if(state.norm==="pctobj"||state.norm==="pctref") return "%";
  if(state.norm==="permin") return (METRICS[state.metric].u||"u")+"/min";
  return METRICS[state.metric].u;
}
function niceTicks(min,max,count=5){
  const span=max-min || 1;
  const step0=span/count;
  const mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const t=[]; for(let v=lo;v<=hi+1e-9;v+=step) t.push(+v.toFixed(6));
  return t;
}

/* ---------- element helper (HTML + SVG) ---------- */
const NS="http://www.w3.org/2000/svg";
const SVG_TAGS=new Set(["svg","g","path","circle","rect","line","text","polygon","title"]);
function el(tag, attrs={}, kids=[]){
  const n=SVG_TAGS.has(tag) ? document.createElementNS(NS,tag) : document.createElement(tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  (Array.isArray(kids)?kids:[kids]).forEach(c=> c!=null && n.appendChild(typeof c==="string"?document.createTextNode(c):c));
  return n;
}

/* ---------- render shell ---------- */
function renderShell(){
  document.getElementById("season-lab").textContent = "AT Baleares · Temporada "+(RAW.meta.temporada||"");
  document.getElementById("gen-lab").textContent = "Actualizado "+(RAW.meta.generado||"");

  // KPIs
  const ses = RAW.sessions.filter(s=>!s.isMatch);
  let realSum=0, objSum=0;
  RAW.sessions.forEach(s=>{ if(s.isMatch) return;
    s.players.forEach(pr=> RADAR_METRICS.forEach(m=>{
      const c=raw(pr,m); if(c.obj!=null && c.real!=null){ realSum+=c.real; objSum+=c.obj; }
    }));
  });
  const cumpl = objSum? realSum/objSum*100 : null;
  let bestV=0, bestName="";
  RAW.sessions.forEach(s=> s.players.forEach(pr=>{ if(pr.vmax>bestV){ bestV=pr.vmax; bestName=NAME[pr.d]; }}));
  const kpis=[
    {n:ses.length, l:"Sesiones"},
    {n:MICROS.length, l:"Microciclos"},
    {n:(cumpl!=null?fmtN(cumpl,0)+"%":"–"), l:"Cumplimiento medio obj."},
    {n:fmtN(bestV,1), sm:" km/h", l:"Vel. máx · "+(bestName.split(",")[0]||"")},
    {n:PLAYERS.length, l:"Jugadores"},
  ];
  document.getElementById("kpis").innerHTML = kpis.map(k=>
    `<div class="kpi"><div class="n">${k.n}${k.sm?`<small>${k.sm}</small>`:""}</div><div class="l">${k.l}</div></div>`
  ).join("");

  // Filters
  const f=document.getElementById("filters");
  f.innerHTML="";
  f.appendChild(fSelect("Métrica","metric",Object.entries(METRICS).map(([k,v])=>[k,v.lab])));
  f.appendChild(fSelect("Normalización","norm",Object.entries(NORMS).map(([k,v])=>[k,v.lab])));
  f.appendChild(fChips("Grupo","group",[["all","Todos"],...Object.entries(GROUPS)],false));
  f.appendChild(fBucketChips());

  // Tabs
  const tabDefs=[
    ["evolucion","Evolución"],["sesion","Sesión"],["microciclos","Microciclos"],
    ["tipo","Tipo de sesión"],["partidos","Partidos"],
    ["jugadores","Jugadores"],["comparador","Comparador"],["lesionados","Lesionados"],
  ];
  const t=document.getElementById("tabs"); t.innerHTML="";
  tabDefs.forEach(([k,lab])=>{
    const b=el("button",{class:"tab",role:"tab","aria-selected":state.lens===k, "data-k":k});
    b.textContent=lab;
    b.onclick=()=>{ state.lens=k; renderShell(); renderView(); };
    t.appendChild(b);
  });
  renderView();
}
function fSelect(label, key, opts){
  const g=el("label",{class:"fgroup"}); g.appendChild(el("span",{},label));
  const s=el("select");
  opts.forEach(([v,l])=>{ const o=el("option",{value:v},l); if(state[key]===v)o.selected=true; s.appendChild(o); });
  s.onchange=()=>{ state[key]=s.value; renderView(); };
  g.appendChild(s); return g;
}
function fChips(label, key, opts, multi){
  const g=el("label",{class:"fgroup"}); g.appendChild(el("span",{},label));
  const box=el("div",{class:"chips"});
  opts.forEach(([v,l])=>{
    const b=el("button",{class:"chip","aria-pressed":state[key]===v},l);
    b.onclick=()=>{ state[key]=v; renderShell(); renderView(); };
    box.appendChild(b);
  });
  g.appendChild(box); return g;
}
function fBucketChips(){
  const g=el("label",{class:"fgroup"}); g.appendChild(el("span",{},"Tipo de sesión"));
  const box=el("div",{class:"chips"});
  BUCKET_ORDER.forEach(bk=>{
    if(!RAW.sessions.some(s=>s.bucket===bk)) return;
    const b=el("button",{class:"chip sm","aria-pressed":state.buckets.has(bk)},bk);
    b.onclick=()=>{ state.buckets.has(bk)?state.buckets.delete(bk):state.buckets.add(bk); renderShell(); renderView(); };
    box.appendChild(b);
  });
  g.appendChild(box); return g;
}

/* ---------- views ---------- */
function renderView(){

  ({evolucion:viewEvolucion, sesion:viewSesion, microciclos:viewMicrociclos, tipo:viewTipo, partidos:viewPartidos,

}
function panel(title, desc){
  const p=el("div",{class:"panel"});

  if(desc) l.appendChild(el("p",{},desc));
  h.appendChild(l); p.appendChild(h);

}
function legendRow(items){
  const d=el("div",{class:"legend"});
  items.forEach(it=>{
    const s=el("span");
    s.innerHTML = (it.line?`<i class="ln" style="border-top-color:${it.c}"></i>`:`<i style="background:${it.c}"></i>`)+it.t;
    d.appendChild(s);
  });
  return d;
}

/* ===== 1 · EVOLUCIÓN ===== */
function viewEvolucion(root){
  const M=METRICS[state.metric];
  const sessions=activeSessions();
  const showBand = !M.noObj && (state.norm==="abs"||state.norm==="pctobj"||state.norm==="permin"||state.norm==="pctref");
  const p=panel("Evolución de la carga",
    `${M.lab} · ${NORMS[state.norm].lab.toLowerCase()} — media del equipo por sesión, en orden cronológico. La banda verde es el objetivo.`);

  const picked=[...state.players];
  p.appendChild(legendRow([
    {c:"var(--ink)", t:"Media equipo", line:true},
    ...(showBand?[{c:"var(--sem-ok)", t:"Objetivo"}]:[]),
    ...picked.map((d,i)=>({c:SERIES_COLORS[i%6], t:NAME[d].split(",")[0], line:true})),
  ]));

  // player picker
  const pick=el("div",{class:"pick"});
  PLAYERS.forEach(pl=>{
    const on=state.players.has(pl.d);
    const b=el("button",{class:"chip sm","aria-pressed":on, title:pl.n},"#"+pl.d+" "+pl.n.split(",")[0]);
    b.onclick=()=>{
      if(on) state.players.delete(pl.d);
      else { if(state.players.size>=6) return; state.players.add(pl.d); }
      renderView();
    };
    pick.appendChild(b);
  });
  p.appendChild(pick);

  // ---- build series ----
  const xs = sessions.map((s,i)=>i);
  const teamY = sessions.map(s=> teamPoint(s, state.metric, state.norm));
  const objY  = showBand ? sessions.map(s=> teamObj(s, state.metric, state.norm)) : [];
  const playerY = picked.map(d=> sessions.map(s=> playerPoint(s, d, state.metric, state.norm)));

  const allV=[...teamY, ...objY, ...playerY.flat()].filter(v=>v!=null && isFinite(v));
  if(!allV.length){ p.appendChild(el("p",{class:"note"},"Sin datos para esta combinación de filtros.")); root.appendChild(p); return; }
  let vmin=Math.min(...allV), vmax=Math.max(...allV);
  if(state.norm==="pctobj"){ vmin=Math.min(vmin,80); vmax=Math.max(vmax,120); }
  const ticks=niceTicks(Math.min(vmin,0)===0&&vmin>=0?0:vmin, vmax, 5);
  vmin=ticks[0]; vmax=ticks[ticks.length-1];

  const W=980, H=380, mL=54, mR=16, mT=26, mB=64;
  const iw=W-mL-mR, ih=H-mT-mB;
  const X = i => mL + (sessions.length<=1?iw/2:iw*i/(sessions.length-1));
  const Y = v => mT + ih - ih*(v-vmin)/(vmax-vmin);

  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"Gráfica de evolución"});

  // microciclo bands
  let seg=[]; sessions.forEach((s,i)=>{ (seg[s.mc]=seg[s.mc]||[]).push(i); });
  Object.entries(seg).forEach(([mc,idxs],k)=>{
    if(k%2===0){
      const x0=X(idxs[0])-(X(1)-X(0))/2, x1=X(idxs[idxs.length-1])+(X(1)-X(0))/2;
      svg.appendChild(el("rect",{class:"mcband", x:Math.max(mL,x0), y:mT, width:Math.min(x1,W-mR)-Math.max(mL,x0), height:ih, opacity:.6}));
    }
    const xc=(X(idxs[0])+X(idxs[idxs.length-1]))/2;
    svg.appendChild(el("text",{class:"mclab", x:xc, y:mT-10, "text-anchor":"middle"}, "M"+mc));
  });

  // grid + y axis
  const g=el("g",{class:"grid"});
  ticks.forEach(tk=> g.appendChild(el("line",{x1:mL, x2:W-mR, y1:Y(tk), y2:Y(tk)})));
  svg.appendChild(g);
  const ax=el("g",{class:"axis"});
  ticks.forEach(tk=> ax.appendChild(el("text",{x:mL-8, y:Y(tk)+3.5, "text-anchor":"end"}, fmtN(tk, state.norm==="permin"?1:0))));
  ax.appendChild(el("text",{class:"axis-lab", x:mL-40, y:mT-12}, unitLabel()));
  svg.appendChild(ax);

  // objective band
  if(showBand && objY.some(v=>v!=null)){
    if(state.norm==="pctobj"){
      svg.appendChild(el("rect",{class:"band-fill", x:mL, y:Y(110), width:iw, height:Y(90)-Y(110)}));
      svg.appendChild(el("line",{class:"band-line", x1:mL, x2:W-mR, y1:Y(100), y2:Y(100)}));
    } else {
      const dpath = line(objY.map((v,i)=> v==null?null:[X(i),Y(v)]));
      // simple filled ribbon +/-10%
      const up=line(objY.map((v,i)=> v==null?null:[X(i),Y(v*1.1)]));
      const dn=objY.map((v,i)=> v==null?null:[X(i),Y(v*0.9)]).filter(Boolean).reverse();
      if(up && dn.length){
        svg.appendChild(el("path",{class:"band-fill", d: up+" L"+dn.map(p=>p.join(",")).join(" L")+" Z"}));
      }
      svg.appendChild(el("path",{class:"band-line", d:dpath}));
    }
  }

  // player series
  playerY.forEach((ys,idx)=>{
    svg.appendChild(el("path",{class:"serie", d:line(ys.map((v,i)=> v==null?null:[X(i),Y(v)])), stroke:SERIES_COLORS[idx%6]}));
    ys.forEach((v,i)=> v!=null && svg.appendChild(el("circle",{class:"dot", cx:X(i), cy:Y(v), r:2.6, fill:SERIES_COLORS[idx%6]})));
  });
  // team series (on top)
  svg.appendChild(el("path",{class:"serie team", d:line(teamY.map((v,i)=> v==null?null:[X(i),Y(v)]))}));
  teamY.forEach((v,i)=>{
    if(v==null) return;
    const s=sessions[i];
    svg.appendChild(el(s.isMatch?"rect":"circle", s.isMatch
      ? {class:"dot", x:X(i)-3, y:Y(v)-3, width:6, height:6, fill:"var(--ink)", transform:`rotate(45 ${X(i)} ${Y(v)})`}
      : {class:"dot", cx:X(i), cy:Y(v), r:3, fill:"var(--ink)"}));
  });

  // x labels
  const xa=el("g",{class:"axis"});
  sessions.forEach((s,i)=>{
    const t=el("text",{x:X(i), y:H-mB+16, "text-anchor":"end", transform:`rotate(-42 ${X(i)} ${H-mB+16})`}, s.key);
    xa.appendChild(t);
  });
  svg.appendChild(xa);

  // hover
  const cross=el("line",{class:"crosshair", y1:mT, y2:mT+ih, x1:mL, x2:mL, opacity:0});
  svg.appendChild(cross);
  const box=el("div",{class:"chart-box"});
  box.appendChild(svg);
  const tip=el("div",{class:"tt"}); box.appendChild(tip);
  const hit=el("rect",{x:mL, y:mT, width:iw, height:ih, fill:"transparent"});
  svg.appendChild(hit);
  hit.addEventListener("pointermove", ev=>{
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*W;
    let i=Math.round((px-mL)/(iw/Math.max(1,sessions.length-1)));
    i=Math.max(0,Math.min(sessions.length-1,i));
    const s=sessions[i];
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i)); cross.setAttribute("opacity",1);
    const rows=[];
    if(teamY[i]!=null) rows.push(`<div class="row"><span><i style="background:var(--ink)"></i>Equipo</span><b>${fmtN(teamY[i], state.norm==="permin"?2:1)}</b></div>`);
    if(showBand && objY[i]!=null && state.norm!=="pctobj") rows.push(`<div class="row"><span>Objetivo</span><b>${fmtN(objY[i],1)}</b></div>`);
    playerY.forEach((ys,idx)=>{ if(ys[i]!=null) rows.push(`<div class="row"><span><i style="background:${SERIES_COLORS[idx%6]}"></i>${NAME[picked[idx]].split(",")[0]}</span><b>${fmtN(ys[i],1)}</b></div>`); });
    tip.innerHTML=`<h4><span>${s.key}</span><span class="muted">${s.bucket}</span></h4>`+
      `<div class="row" style="margin-bottom:3px"><span>M${s.mc}${s.rival?" · "+s.rival:""}</span><span class="muted">${s.date.slice(5)}</span></div>`+rows.join("");
    tip.style.opacity=1;
    const bx=X(i)/W*r.width;
    tip.style.left=Math.min(r.width-170, Math.max(0,bx+12))+"px";
    tip.style.top="12px";
  });
  hit.addEventListener("pointerleave", ()=>{ tip.style.opacity=0; cross.setAttribute("opacity",0); });

  p.appendChild(box);
  p.appendChild(el("p",{class:"note"},
    "Rombo = partido. Bandas verticales = microciclos. "+
    (M.noObj? "Esta métrica no tiene objetivo cargado (Player Load / Vel. máx)." : "")));
  root.appendChild(p);
}
function line(pts){
  let d="", pen=false;
  pts.forEach(pt=>{
    if(!pt){ pen=false; return; }
    d += (pen?" L":" M")+pt[0].toFixed(1)+","+pt[1].toFixed(1);
    pen=true;
  });
  return d.trim();
}

/* ===== 1b · SESIÓN ===== */
function viewSesion(root){
  const sessions = activeSessions();
  const p=panel("Sesión",
    "Detalle completo de una sesión concreta: objetivo, real y % de cumplimiento de cada jugador, métrica a métrica.");
  if(!sessions.length){ p.appendChild(el("p",{class:"note"},"Sin sesiones con los filtros actuales.")); root.appendChild(p); return; }

  if(state.session==null || !sessions.some(s=>s.i===state.session)){
    let def=null;
    for(let i=sessions.length-1;i>=0;i--) if(sessionHasData(sessions[i])){ def=sessions[i].i; break; }
    state.session = def!=null? def : sessions[sessions.length-1].i;
  }
  const pos = sessions.findIndex(s=>s.i===state.session);
  const s = sessions[pos];

  // selector + navegación
  const nav=el("div",{style:"display:flex; align-items:center; gap:8px; padding:0 16px 12px; flex-wrap:wrap"});
  const prevBtn=el("button",{class:"chip sm","aria-label":"Sesión anterior"},"← Anterior");
  const nextBtn=el("button",{class:"chip sm","aria-label":"Sesión siguiente"},"Siguiente →");
  if(pos<=0) prevBtn.setAttribute("disabled","");
  if(pos>=sessions.length-1) nextBtn.setAttribute("disabled","");
  prevBtn.onclick=()=>{ if(pos>0){ state.session=sessions[pos-1].i; renderView(); } };
  nextBtn.onclick=()=>{ if(pos<sessions.length-1){ state.session=sessions[pos+1].i; renderView(); } };
  const sel=el("select",{style:"flex:1; min-width:240px"});
  sessions.forEach(ss=>{
    const o=el("option",{value:ss.i}, sessionLabel(ss)); if(ss.i===s.i) o.selected=true; sel.appendChild(o);
  });
  sel.onchange=()=>{ state.session=+sel.value; renderView(); };
  nav.append(prevBtn, sel, nextBtn);
  p.appendChild(nav);

  // cabecera
  const badge = s.isMatch ? (isOficial(s)?"Partido oficial":"Amistoso") : s.bucket;
  const info=el("p",{class:"note", style:"padding:0 16px 10px; font-size:12.5px"});
  info.append((s.rival? "vs "+s.rival+" · " : "")+"Microciclo "+s.mc+(s.mcTipo?" (Tipo "+s.mcTipo+")":"")+" · "+s.date+"  ");
  info.appendChild(el("span",{class:"badge-pend", style:"background:var(--accent); color:var(--on-accent)"}, badge));
  p.appendChild(info);
  if(s.estimado){
    const w=el("p",{class:"note", style:"padding:0 16px 10px"});
    w.appendChild(el("span",{class:"badge-warn"},"⚠ Datos estimados"));
    w.append(" — sin GPS real de este partido; valores reconstruidos a partir de REF_PARTIDO y los minutos jugados.");
    p.appendChild(w);
  }

  if(!sessionHasData(s)){
    p.appendChild(el("p",{class:"note"},"Todavía no hay datos cargados para esta sesión."));
    root.appendChild(p); return;
  }

  const visibles = s.players.filter(inGroup).sort((a,b)=>a.d-b.d);
  // lesionados y en readaptación van en su propia tabla, debajo de la del equipo
  const players = visibles.filter(pr=>!esBaja(pr,s));
  const bajas = visibles.filter(pr=>esBaja(pr,s));
  // el resumen de equipo (Vel.máx/PL/Duración) usa la MEDIA EQUIPO oficial (s.teamAvg) cuando
  // se ve la plantilla completa; si hay un filtro de Grupo activo, no hay cifra oficial para
  // ese subconjunto y se recalcula a mano sobre los jugadores visibles.
  let vmaxTeam=null, plTeam=null, durTeam=null;
  if(state.group==="all" && s.teamAvg){
    vmaxTeam=s.teamAvg.vmax; plTeam=s.teamAvg.pl; durTeam=s.teamAvg.dur;
  } else {
    let plSum=0,plN=0,durSum=0,durN=0;
    players.forEach(pr=>{
      if(pr.vmax!=null && (vmaxTeam==null||pr.vmax>vmaxTeam)) vmaxTeam=pr.vmax;
      if(pr.pl!=null){ plSum+=pr.pl; plN++; }
      if(pr.dur!=null){ durSum+=pr.dur; durN++; }
    });
    plTeam = plN? plSum/plN : null;
    durTeam = durN? durSum/durN : null;
  }
  if(durTeam==null){   // la fila oficial no trae duración: media de los jugadores del grupo con dato
    const ds=players.map(pr=>pr.dur).filter(v=>v!=null);
    durTeam = ds.length? ds.reduce((a,b)=>a+b,0)/ds.length : null;
  }
  const nConDatos = players.filter(pr=> RADAR_METRICS.some(k=>raw(pr,k).real!=null)).length;

  const miniData=[
    {n:nConDatos, l:"Jugadores con datos"},
    {n:vmaxTeam!=null?fmtN(vmaxTeam,1):"–", sm:" km/h", l:"Vel. máx equipo"},
    {n:plTeam!=null?fmtN(plTeam,0):"–", l:"Player Load medio"},
    {n:durTeam!=null?fmtN(durTeam,0):"–", sm:" min", l:"Duración media"},
  ];
  const mini=el("div",{class:"mini-kpis"});
  mini.innerHTML = miniData.map(k=>`<div class="kpi"><div class="n">${k.n}${k.sm?`<small>${k.sm}</small>`:""}</div><div class="l">${k.l}</div></div>`).join("");
  p.appendChild(mini);

  p.appendChild(legendRow([
    {c:"var(--sem-corto)",t:"< 90% obj."},{c:"var(--sem-ok)",t:"90–110%"},
    {c:"var(--sem-pasado)",t:"110–120%"},{c:"var(--sem-alto)",t:"> 120%"},
  ]));

  // tabla: cada jugador × cada métrica (obj/real/%)
  const wrap=el("div",{class:"tbl-scroll sticky-col"});
  const tb=el("table");
  const head1=['<th rowspan="2">Jugador</th>','<th rowspan="2">Pos</th>']
    .concat(RADAR_METRICS.map(k=>`<th colspan="3" class="grp-start">${METRICS[k].lab}${METRICS[k].u?` (${METRICS[k].u})`:""}</th>`))
    .concat(['<th rowspan="2" class="grp-start">Vel. máx<br>(km/h)</th>','<th rowspan="2">Player<br>Load</th>','<th rowspan="2">Duración</th>'])
    .join("");
  const head2=RADAR_METRICS.map(()=>'<th class="grp-start">Obj</th><th>Real</th><th>%</th>').join("");
  tb.innerHTML=`<thead><tr>${head1}</tr><tr>${head2}</tr></thead>`;
  const body=el("tbody");

  function pctCell(pct){
    if(pct==null) return `<td class="mono">–</td>`;
    const col = pct<90?"var(--sem-corto)": pct<=110?"var(--sem-ok)": pct<=120?"var(--sem-pasado)":"var(--sem-alto)";
    return `<td class="mono" style="color:${col}; font-weight:700">${Math.round(pct)}%</td>`;
  }

  players.forEach(pr=>{
    const g=POS[pr.d];
    const cells=[`<td>#${pr.d} ${NAME[pr.d]||"?"}</td>`, `<td class="pos-${g||""}">${GROUPS[g]||g||"–"}</td>`];
    let hasAny=false;
    RADAR_METRICS.forEach(k=>{
      const c=raw(pr,k);
      if(c.real!=null) hasAny=true;
      const pct=(c.obj&&c.real!=null)? c.real/c.obj*100 : null;
      cells.push(`<td class="mono v-obj grp-start">${c.obj!=null?fmtN(c.obj,METRICS[k].dec):"–"}</td>`);
      cells.push(`<td class="mono v-real">${c.real!=null?fmtN(c.real,METRICS[k].dec):"–"}</td>`);
      cells.push(pctCell(pct));
    });
    if(pr.vmax!=null||pr.pl!=null) hasAny=true;
    cells.push(`<td class="mono grp-start">${pr.vmax!=null?fmtN(pr.vmax,1):"–"}</td>`);
    cells.push(`<td class="mono">${pr.pl!=null?fmtN(pr.pl,0):"–"}</td>`);
    cells.push(`<td class="mono">${pr.dur!=null?fmtN(pr.dur,0)+"′":"–"}</td>`);
    const tr=el("tr", hasAny?{}:{style:"color:var(--ink-3)"}); tr.innerHTML=cells.join("");
    body.appendChild(tr);
  });

  // fila MEDIA EQUIPO
  const teamCells=['<td>MEDIA EQUIPO</td>','<td></td>'];
  RADAR_METRICS.forEach(k=>{
    const teamReal=teamPoint(s,k,"abs"), teamObjV=teamObj(s,k,"abs");
    const pct=(teamObjV&&teamReal!=null)? teamReal/teamObjV*100 : null;
    teamCells.push(`<td class="mono v-obj grp-start">${teamObjV!=null?fmtN(teamObjV,METRICS[k].dec):"–"}</td>`);
    teamCells.push(`<td class="mono v-real">${teamReal!=null?fmtN(teamReal,METRICS[k].dec):"–"}</td>`);
    teamCells.push(pctCell(pct));
  });
  teamCells.push(`<td class="mono grp-start">${vmaxTeam!=null?fmtN(vmaxTeam,1):"–"}</td>`);
  teamCells.push(`<td class="mono">${plTeam!=null?fmtN(plTeam,0):"–"}</td>`);
  teamCells.push(`<td class="mono">${durTeam!=null?fmtN(durTeam,0)+"′":"–"}</td>`);
  const trTeam=el("tr",{class:"total"}); trTeam.innerHTML=teamCells.join(""); body.appendChild(trTeam);

  tb.appendChild(body); wrap.appendChild(tb); p.appendChild(wrap);
  p.appendChild(el("p",{class:"note"},"Jugadores en gris: no tienen dato real cargado en esta sesión (descanso o gestión de carga). Los lesionados y en readaptación van aparte, debajo."));
  if(bajas.length) p.appendChild(tablaBajas(s, bajas));
  root.appendChild(p);
}

// tabla aparte de la pestaña Sesión: lesionados (sin sesión) y readaptación (con su real)

    `<th class="grp-start">Vel. máx</th><th>Player Load</th><th>Duración</th></tr></thead>`;
  const body=el("tbody");
  bajas.forEach(pr=>{
    const l=lesionEn(pr.d, s.date);

    const sit = conDatos ? "Readaptación" : "Baja";
    const cells=[`<td>#${pr.d} ${NAME[pr.d]||"?"}</td>`,
      `<td><span class="tag-les ${conDatos?"rehab":"baja"}">${sit}</span></td>`,
      `<td style="text-align:left">${l?l.tipo:"–"}</td>`,
      `<td class="mono">${l?diasEntre(l.baja, s.date)+1:"–"}</td>`];
    RADAR_METRICS.forEach((k,i)=>{
      const v=raw(pr,k).real;
      cells.push(`<td class="mono${i===0?" grp-start":""}">${v!=null?fmtN(v,METRICS[k].dec):"–"}</td>`);
    });
    cells.push(`<td class="mono grp-start">${pr.vmax!=null?fmtN(pr.vmax,1):"–"}</td>`);
    cells.push(`<td class="mono">${pr.pl!=null?fmtN(pr.pl,0):"–"}</td>`);
    cells.push(`<td class="mono">${pr.dur!=null?fmtN(pr.dur,0)+"′":"–"}</td>`);
    const tr=el("tr"); tr.innerHTML=cells.join(""); body.appendChild(tr);

  box.appendChild(el("p",{class:"note"},"No cuentan para la MEDIA EQUIPO ni tienen objetivo. \"Día\" = día de baja (el de la lesión es el día 1)."));
  return box;
}

/* ===== 2 · MICROCICLOS ===== */
function viewMicrociclos(root){
  const M=METRICS[state.metric];
  const p=panel("Comparativa de microciclos",
    `${M.lab} acumulada por microciclo (suma de la media del equipo en cada sesión). Objetivo vs real y % de cumplimiento.`);

  const rows = MICROS.map(mc=>{
    const ss = RAW.sessions.filter(s=>s.mc===mc && !s.isMatch && state.buckets.has(s.bucket));
    let real=0, obj=0, hasObj=false, n=0;
    ss.forEach(s=>{
      const tv=teamPoint(s, state.metric, "abs"); if(tv!=null){ real+=tv; n++; }
      const to=teamObj(s, state.metric, "abs"); if(to!=null){ obj+=to; hasObj=true; }
    });
    return {mc, real, obj:hasObj?obj:null, n, tipo:(RAW.sessions.find(s=>s.mc===mc)||{}).mcTipo};
  }).filter(r=>r.n>0);

  if(!rows.length){ p.appendChild(el("p",{class:"note"},"Sin datos.")); root.appendChild(p); return; }
  p.appendChild(legendRow([{c:"var(--sem-na)",t:"Objetivo"},{c:"var(--s1)",t:"Real"}]));

  const W=980,H=340,mL=54,mR=16,mT=16,mB=42;
  const iw=W-mL-mR, ih=H-mT-mB;
  const vmax=Math.max(...rows.flatMap(r=>[r.real, r.obj||0]))*1.12 || 1;
  const ticks=niceTicks(0,vmax,5);
  const Y=v=> mT+ih - ih*v/ticks[ticks.length-1];
  const bw=iw/rows.length;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"Barras por microciclo"});
  const g=el("g",{class:"grid"});
  ticks.forEach(tk=>g.appendChild(el("line",{x1:mL,x2:W-mR,y1:Y(tk),y2:Y(tk)})));
  svg.appendChild(g);
  const ax=el("g",{class:"axis"});
  ticks.forEach(tk=>ax.appendChild(el("text",{x:mL-8,y:Y(tk)+3.5,"text-anchor":"end"}, fmtN(tk,0))));
  ax.appendChild(el("text",{class:"axis-lab",x:mL-40,y:mT-4}, METRICS[state.metric].u||"u"));
  svg.appendChild(ax);

  rows.forEach((r,i)=>{
    const x0=mL+bw*i, cx=x0+bw/2;
    if(r.obj!=null) svg.appendChild(el("rect",{x:cx-bw*0.34, y:Y(r.obj), width:bw*0.30, height:mT+ih-Y(r.obj), fill:"var(--sem-na)", rx:3}));
    svg.appendChild(el("rect",{x:cx+bw*0.02, y:Y(r.real), width:bw*0.30, height:mT+ih-Y(r.real), fill:"var(--s1)", rx:3}));
    svg.appendChild(el("text",{class:"axis",x:cx,y:H-mB+16,"text-anchor":"middle","font-weight":600,fill:"var(--ink-2)"}, "M"+r.mc));
    if(r.obj){
      const pct=r.real/r.obj*100;
      const col = pct<90?"var(--sem-corto)": pct<=110?"var(--sem-ok)": pct<=120?"var(--sem-pasado)":"var(--sem-alto)";
      svg.appendChild(el("text",{x:cx, y:Y(Math.max(r.real,r.obj))-6, "text-anchor":"middle", "font-size":11, "font-weight":700, fill:col}, Math.round(pct)+"%"));
    }
  });
  const box=el("div",{class:"chart-box"}); box.appendChild(svg); p.appendChild(box);

  // table
  const wrap=el("div",{class:"tbl-scroll"});
  const tb=el("table");
  tb.innerHTML=`<thead><tr><th>Microciclo</th><th>Tipo</th><th>Sesiones</th><th>Objetivo</th><th>Real</th><th>Cumpl.</th></tr></thead>`;
  const body=el("tbody");
  rows.forEach(r=>{
    const pct=r.obj? r.real/r.obj*100 : null;
    body.appendChild(el("tr",{},[
      el("td",{},"Microciclo "+r.mc),
      el("td",{},r.tipo||"–"),
      el("td",{class:"mono"},String(r.n)),
      el("td",{class:"mono"},fmtN(r.obj,0)),
      el("td",{class:"mono"},fmtN(r.real,0)),
      el("td",{class:"mono"},pct!=null?Math.round(pct)+"%":"–"),
    ]));
  });
  tb.appendChild(body); wrap.appendChild(tb); p.appendChild(wrap);
  root.appendChild(p);
  root.appendChild(el("div",{style:"height:16px"}));
  root.appendChild(panelAcumulado());
}

/* ----- Acumulado de la semana (equivale a la hoja "Acumulado" del Excel) ----- */
// Obj semana = Σ Obj de las sesiones de entrenamiento · Obj a fecha = Σ Obj de las ya hechas ·
// Acumulado = Σ real de sesiones + Extra; quien tiene objetivo semanal solo acumula desde su primer
// día con objetivo (la readaptación previa no se compara con el objetivo). Media = con objetivo.
function acumuladoSemana(mc){
  const ses = RAW.sessions.filter(s=>s.mc===mc && !s.isMatch);
  const hechas = ses.filter(sessionHasData);
  const extras = RAW.extras.filter(s=>s.mc===mc);
  const filas = {};
  const f = d => filas[d] || (filas[d] = {d, obj:{}, objF:{}, acum:{}, pl:null, min:null, desde:null, parcial:false});
  const conObj = pr => RADAR_METRICS.some(k=>raw(pr,k).obj!=null);
  const conReal = pr => pr.pl!=null || RADAR_METRICS.some(k=>raw(pr,k).real!=null);
  // primer día con objetivo de la semana de cada jugador
  const desde = {};
  ses.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(s=> s.players.forEach(pr=>{ if(conObj(pr) && !desde[pr.d]) desde[pr.d]=s.date; }));
  const suma = (o,k,v)=>{ if(v!=null) o[k]=(o[k]||0)+v; };
  ses.forEach(s=>{
    const hecha = hechas.includes(s);
    s.players.forEach(pr=>{
      const r=f(pr.d); r.desde=desde[pr.d]||null;
      RADAR_METRICS.forEach(k=>{ const c=raw(pr,k); suma(r.obj,k,c.obj); if(hecha) suma(r.objF,k,c.obj); });
      if(r.desde && !conObj(pr)){ if(conReal(pr)) r.parcial=true; return; }   // readaptación antes de volver
      RADAR_METRICS.forEach(k=> suma(r.acum,k,raw(pr,k).real));
      if(pr.pl!=null) r.pl=(r.pl||0)+pr.pl;
      if(pr.dur!=null && conReal(pr)) r.min=(r.min||0)+pr.dur;
    });
  });
  extras.forEach(s=> s.players.forEach(pr=>{
    const r=f(pr.d);
    if(desde[pr.d] && s.date<desde[pr.d]){ r.parcial=true; return; }
    RADAR_METRICS.forEach(k=> suma(r.acum,k,raw(pr,k).real));
    if(pr.pl!=null) r.pl=(r.pl||0)+pr.pl;
    if(pr.dur!=null) r.min=(r.min||0)+pr.dur;
  }));
  return {ses, hechas, filas:Object.values(filas).sort((a,b)=>a.d-b.d)};
}
function panelAcumulado(){
  const conDatos = MICROS.filter(mc=> RAW.sessions.some(s=>s.mc===mc && !s.isMatch && sessionHasData(s)));
  if(state.acuMc==null || !conDatos.includes(state.acuMc)) state.acuMc = conDatos[conDatos.length-1];
  const mc = state.acuMc;
  const A = acumuladoSemana(mc);
  const completa = A.hechas.length===A.ses.length;
  if(state.acuRef==null) state.acuRef = "fecha";
  const refKey = (state.acuRef==="fecha" && !completa) ? "objF" : "obj";
  const semana = (RAW.sessions.find(s=>s.mc===mc)||{}).semana || ("Microciclo "+mc);
  const p=panel("Acumulado de la semana",
    "Suma de las sesiones de entrenamiento de la semana (sin el partido) frente al objetivo semanal de cada jugador, como la hoja Acumulado del Excel. Las sesiones Extra suman al acumulado.");

  const bar=el("div",{class:"les-pick"});
  const gm=el("div",{class:"fgroup"}); gm.appendChild(el("span",{},"Microciclo"));
  const sel=el("select");
  conDatos.slice().reverse().forEach(m=>{ const o=el("option",{value:m},"M"+m); if(m===mc) o.selected=true; sel.appendChild(o); });
  sel.onchange=()=>{ state.acuMc=+sel.value; renderView(); };
  gm.appendChild(sel); bar.appendChild(gm);
  const gr=el("div",{class:"fgroup"}); gr.appendChild(el("span",{},"Comparar con"));
  const box=el("div",{class:"chips"});
  [["fecha","Objetivo a fecha"],["semana","Objetivo semana"]].forEach(([v,t])=>{
    const b=el("button",{class:"chip sm","aria-pressed":state.acuRef===v},t);
    if(v==="fecha" && completa){ b.setAttribute("disabled",""); b.title="La semana ya está completa: el objetivo a fecha es el de la semana"; }
    b.onclick=()=>{ state.acuRef=v; renderView(); };
    box.appendChild(b);
  });
  gr.appendChild(box); bar.appendChild(gr);
  p.appendChild(bar);

  p.appendChild(el("p",{class:"note", style:"padding-bottom:8px"},
    `${semana} · ${A.hechas.length} de ${A.ses.length} sesiones cargadas (${A.hechas.map(s=>s.key).join(", ")||"ninguna"})`+
    (completa?" · semana completa":` · % frente al objetivo ${refKey==="objF"?"a fecha (sesiones ya hechas)":"de la semana entera"}`)));

  const visibles = A.filas.filter(r=> inGroup({d:r.d}));
  const conObj = visibles.filter(r=> RADAR_METRICS.some(k=>r.obj[k]!=null));
  const sinObj = visibles.filter(r=> !RADAR_METRICS.some(k=>r.obj[k]!=null) && RADAR_METRICS.some(k=>r.acum[k]!=null));

  p.appendChild(legendRow([
    {c:"var(--sem-corto)",t:"< 90%"},{c:"var(--sem-ok)",t:"90–110%"},
    {c:"var(--sem-pasado)",t:"110–120%"},{c:"var(--sem-alto)",t:"> 120%"},
  ]));
  const pctCell = pct => {
    if(pct==null) return `<td class="mono">–</td>`;
    const col = pct<90?"var(--sem-corto)": pct<=110?"var(--sem-ok)": pct<=120?"var(--sem-pasado)":"var(--sem-alto)";
    return `<td class="mono" style="color:${col}; font-weight:700">${Math.round(pct)}%</td>`;
  };
  const wrap=el("div",{class:"tbl-scroll sticky-col"});
  const tb=el("table");
  tb.innerHTML=`<thead><tr><th rowspan="2">Jugador</th><th rowspan="2">Pos</th>`+
    RADAR_METRICS.map(k=>`<th colspan="3" class="grp-start">${METRICS[k].lab}${METRICS[k].u?` (${METRICS[k].u})`:""}</th>`).join("")+
    `<th rowspan="2" class="grp-start">Player<br>Load</th><th rowspan="2">Minutos</th></tr><tr>`+
    RADAR_METRICS.map(()=>`<th class="grp-start">${refKey==="objF"?"Obj. fecha":"Obj. sem."}</th><th>Acum.</th><th>%</th>`).join("")+`</tr></thead>`;
  const body=el("tbody");
  const fila=(r, conPct)=>{
    const g=POS[r.d];
    const cells=[`<td>#${r.d} ${NAME[r.d]||"?"}${conPct&&r.parcial?` <span title="Acumulado desde su vuelta (${fDate(r.desde)}); su readaptación anterior no cuenta aquí">†</span>`:""}</td>`, `<td class="pos-${g||""}">${GROUPS[g]||g||"–"}</td>`];
    RADAR_METRICS.forEach(k=>{
      const o=r[refKey][k], a=r.acum[k];
      cells.push(`<td class="mono v-obj grp-start">${o!=null?fmtN(o,METRICS[k].dec):"–"}</td>`);
      cells.push(`<td class="mono v-real">${a!=null?fmtN(a,METRICS[k].dec):"–"}</td>`);
      cells.push(conPct? pctCell(o? (a||0)/o*100 : null) : `<td class="mono">–</td>`);
    });
    cells.push(`<td class="mono grp-start">${r.pl!=null?fmtN(r.pl,0):"–"}</td>`);
    cells.push(`<td class="mono">${r.min!=null?fmtN(r.min,0)+"′":"–"}</td>`);
    const tr=el("tr", RADAR_METRICS.some(k=>r.acum[k]!=null)?{}:{style:"color:var(--ink-3)"}); tr.innerHTML=cells.join("");
    return tr;
  };
  conObj.forEach(r=> body.appendChild(fila(r,true)));
  if(conObj.length){
    const n=conObj.length, med={d:null, obj:{}, objF:{}, acum:{}};
    RADAR_METRICS.forEach(k=>{
      med.obj[k]=conObj.reduce((s,r)=>s+(r.obj[k]||0),0)/n;
      med.objF[k]=conObj.reduce((s,r)=>s+(r.objF[k]||0),0)/n;
      med.acum[k]=conObj.reduce((s,r)=>s+(r.acum[k]||0),0)/n;
    });
    const pls=conObj.map(r=>r.pl).filter(v=>v!=null), mins=conObj.map(r=>r.min).filter(v=>v!=null);
    const cells=['<td>MEDIA EQUIPO</td>','<td></td>'];
    RADAR_METRICS.forEach(k=>{
      const o=med[refKey][k], a=med.acum[k];
      cells.push(`<td class="mono v-obj grp-start">${fmtN(o,METRICS[k].dec)}</td><td class="mono v-real">${fmtN(a,METRICS[k].dec)}</td>`);
      cells.push(pctCell(o? a/o*100 : null));
    });
    cells.push(`<td class="mono grp-start">${pls.length?fmtN(pls.reduce((a,b)=>a+b,0)/pls.length,0):"–"}</td>`);
    cells.push(`<td class="mono">${mins.length?fmtN(mins.reduce((a,b)=>a+b,0)/mins.length,0)+"′":"–"}</td>`);
    const tr=el("tr",{class:"total"}); tr.innerHTML=cells.join(""); body.appendChild(tr);
  }
  tb.appendChild(body); wrap.appendChild(tb); p.appendChild(wrap);
  p.appendChild(el("p",{class:"note"},"MEDIA EQUIPO = jugadores con objetivo semanal (si aún no han sumado nada cuentan 0). Jugadores en gris: sin carga todavía esta semana. † = vuelve a mitad de semana: su acumulado cuenta desde su primer día con objetivo; la readaptación anterior no se compara con el objetivo (sí cuenta en su ACWR)."));

  if(sinObj.length){
    const bx=el("div",{class:"bajas"});

/* ===== 3 · TIPO DE SESIÓN ===== */
function viewTipo(root){
  const M=METRICS[state.metric];
  const p=panel("Distribución por tipo de sesión",
    `${M.lab} · ${NORMS[state.norm].lab.toLowerCase()} — cada punto es una sesión (media del equipo). La caja es media ± desviación. Sirve para ver si cada MD-x se repite con consistencia. Los microciclos 1–7 (pretemporada) van agrupados en «Pretemp.» y no cuentan como MD-x.`);

  const cats = BUCKET_ORDER.filter(b=> state.buckets.has(b) && RAW.sessions.some(s=>s.bucket===b));
  const data = cats.map(c=>{
    const vals = RAW.sessions.filter(s=>s.bucket===c)
      .map(s=>({v:teamPoint(s, state.metric, state.norm), key:s.key, mc:s.mc}))
      .filter(o=>o.v!=null && isFinite(o.v));
    const arr=vals.map(o=>o.v);
    const mean=arr.reduce((a,b)=>a+b,0)/(arr.length||1);
    const sd=Math.sqrt(arr.reduce((a,b)=>a+(b-mean)**2,0)/(arr.length||1));
    return {c, vals, mean:arr.length?mean:null, sd, cv: mean? sd/mean*100 : null};
  }).filter(d=>d.vals.length);

  if(!data.length){ p.appendChild(el("p",{class:"note"},"Sin datos.")); root.appendChild(p); return; }

  const W=980,H=360,mL=54,mR=16,mT=18,mB=44;
  const iw=W-mL-mR, ih=H-mT-mB;
  const all=data.flatMap(d=>d.vals.map(o=>o.v));
  let vmin=Math.min(...all), vmax=Math.max(...all);
  const ticks=niceTicks(state.norm==="abs"?Math.min(0,vmin):vmin, vmax, 5);
  vmin=ticks[0]; vmax=ticks[ticks.length-1];
  const Y=v=> mT+ih - ih*(v-vmin)/(vmax-vmin);
  const bw=iw/data.length;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"Distribución por tipo de sesión"});
  const g=el("g",{class:"grid"});
  ticks.forEach(tk=>g.appendChild(el("line",{x1:mL,x2:W-mR,y1:Y(tk),y2:Y(tk)})));
  svg.appendChild(g);
  const ax=el("g",{class:"axis"});
  ticks.forEach(tk=>ax.appendChild(el("text",{x:mL-8,y:Y(tk)+3.5,"text-anchor":"end"}, fmtN(tk, state.norm==="permin"?1:0))));
  ax.appendChild(el("text",{class:"axis-lab",x:mL-40,y:mT-4}, unitLabel()));
  svg.appendChild(ax);

  data.forEach((d,i)=>{
    const cx=mL+bw*i+bw/2;
    if(d.mean!=null && d.sd>0){
      svg.appendChild(el("rect",{x:cx-26, y:Y(d.mean+d.sd), width:52, height:Math.max(1,Y(d.mean-d.sd)-Y(d.mean+d.sd)), fill:"var(--s1)", opacity:.13, rx:4}));
      svg.appendChild(el("line",{x1:cx-28,x2:cx+28,y1:Y(d.mean),y2:Y(d.mean), stroke:"var(--s1)","stroke-width":2}));
    }
    d.vals.forEach((o,k)=>{
      const jx=cx + ((k%5)-2)*7;
      svg.appendChild(el("circle",{cx:jx, cy:Y(o.v), r:3.2, fill:"var(--ink)", opacity:.55, class:"dot"}));
    });
    svg.appendChild(el("text",{class:"axis",x:cx,y:H-mB+16,"text-anchor":"middle","font-weight":600,fill:"var(--ink-2)"}, d.c));
    if(d.cv!=null) svg.appendChild(el("text",{x:cx,y:H-mB+30,"text-anchor":"middle","font-size":10,fill:"var(--ink-3)"}, "CV "+Math.round(d.cv)+"%"));
  });
  const box=el("div",{class:"chart-box"}); box.appendChild(svg); p.appendChild(box);
  p.appendChild(el("p",{class:"note"},"CV = coeficiente de variación (desviación / media). Cuanto más bajo, más estandarizada está esa tipología de sesión entre microciclos."));
  root.appendChild(p);
}

        if(c.obj!=null&&c.real!=null){ real+=c.real; obj+=c.obj; n++; }
      });
      if(!vn) return;
      const pct=obj?real/obj*100:null;

        el("td",{},bk),
        el("td",{class:"mono"},String(vn)),

      ]));
    });
    t.appendChild(tbody); bt.appendChild(t); grid.appendChild(bt);
    dp.appendChild(grid);

function teamMeanPerMin(metric, dorsalSet){
  let sum=0,n=0;
  RAW.sessions.forEach(s=>{ if(s.isMatch) return;
    s.players.forEach(pr=>{
      if(dorsalSet){ if(!dorsalSet.has(pr.d)) return; } else if(!inGroup(pr)) return;
      const c=raw(pr,metric); if(c.real!=null && pr.dur){ sum+=c.real/pr.dur; n++; }
    });
  });
  return n? sum/n : 0;
}

/* ===== LESIONADOS ===== */
const LES_METRICS = ["distancia","hmld","hsr","sprint","acc","dec","vmax","pl"];
const fDate = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "–";

// sesiones (y Extra) con dato del jugador entre la baja y el alta (el día del alta incluido,
// para ver la vuelta al grupo)
// sesiones con GPS desde la PRIMERA de readaptación (o Extra) hasta el alta incluida;
// el día de la lesión y los días de baja sin readaptar no se muestran
function puntosLesion(l){
  const fin = l.alta || HOY, out=[];
  RAW.sessions.concat(RAW.extras).forEach(s=>{
    if(s.date<l.baja || s.date>fin) return;
    const pr=s.players.find(p=>p.d===l.dorsal);
    if(!pr || !(RADAR_METRICS.some(k=>raw(pr,k).real!=null) || pr.pl!=null)) return;
    out.push({s, pr, alta: !!l.alta && s.date===l.alta, readapt: pr.e==="rehab" || !!s.isExtra});
  });
  out.sort((a,b)=> a.s.date<b.s.date?-1 : a.s.date>b.s.date?1 : 0);
  const i0 = out.findIndex(pt=>pt.readapt);
  return i0<0 ? [] : out.slice(i0);
}
// referencia: su media en sesiones de entrenamiento con el grupo de las 4 semanas previas
function refPrevia(l){
  const desde = new Date(Date.parse(l.baja)-28*86400000).toISOString().slice(0,10);
  const out={n:0};
  LES_METRICS.forEach(k=>{
    const vals=[];
    RAW.sessions.forEach(s=>{
      if(s.isMatch || s.date<desde || s.date>=l.baja) return;
      const pr=s.players.find(p=>p.d===l.dorsal);
      if(!pr || pr.e==="rehab") return;
      const v=raw(pr,k).real; if(v!=null) vals.push(v);
    });
    out[k]= vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    out.n=Math.max(out.n, vals.length);
  });
  return out;
}
function tipoPunto(pt, l){
  if(pt.s.isExtra) return "Extra";
  if(pt.alta) return "Alta · grupo";
  return pt.pr.e==="rehab" ? "Readaptación" : "Grupo";
}
// carga diaria por jugador (sesiones + partidos + Extra) para el ACWR día a día
const DIA = (()=>{
  const m={pl:{}, hsr:{}, sprint:{}};
  RAW.sessions.concat(RAW.extras).forEach(s=> s.players.forEach(pr=>{
    const k=pr.d+"|"+s.date;
    const vals={pl:pr.pl, hsr:raw(pr,"hsr").real, sprint:raw(pr,"sprint").real};
    Object.keys(m).forEach(met=>{ if(vals[met]!=null) m[met][k]=(m[met][k]||0)+vals[met]; });
  }));
  return m;
})();
const addDias = (iso,n)=> new Date(Date.parse(iso)+n*86400000).toISOString().slice(0,10);
// misma fórmula que CARGA_AC: aguda Σ7d/7 ÷ crónica Σ28d/28, días sin sesión = 0
function acwrDia(dorsal, met, iso){
  let a=0, c=0;
  for(let i=0;i<28;i++){ const v=DIA[met][dorsal+"|"+addDias(iso,-i)]||0; c+=v; if(i<7) a+=v; }
  return c? (a/7)/(c/28) : 0;
}
const ACWR_SERIES = {acwr_pl:{lab:"ACWR PL", met:"pl"}, acwr_hsr:{lab:"ACWR HSR", met:"hsr"}, acwr_sprint:{lab:"ACWR Sprints", met:"sprint"}};
const LES_COLORS = {distancia:"var(--s1)", hmld:"var(--s3)", hsr:"var(--s2)", sprint:"var(--s6)", acc:"var(--s4)",
  dec:"var(--s5)", vmax:"#7a5cc8", pl:"#3c8f9e", acwr_pl:"var(--ink)", acwr_hsr:"#b0543a", acwr_sprint:"#8a6d00"};
const lesSel = {};   // id de lesión -> {sel:Set, abs:bool}

function chartLesion(l, pts, ref, cfg){
  const fin = l.alta || HOY;
  const inicio = pts[0].s.date;
  const dias=[]; for(let d=inicio; d<=fin; d=addDias(d,1)) dias.push(d);
  const mets=[...cfg.sel].filter(k=>LES_METRICS.includes(k));
  const acwrs=[...cfg.sel].filter(k=>ACWR_SERIES[k]);
  const abs = cfg.abs && mets.length===1;
  // el viewBox sigue al ancho real para que el texto no quede diminuto en el móvil
  const ancho=(document.getElementById("view").clientWidth||980)-40;
  const W=Math.max(360, Math.min(980, ancho)), H=W<600? 300 : 360;
  const mL=W<600?42:54, mR=acwrs.length?(W<600?34:48):12, mT=18, mB=40, iw=W-mL-mR, ih=H-mT-mB;
  const cadaX = W<600? 14 : 7;
  const X=d=> mL + (dias.length<=1? iw/2 : iw*diasEntre(inicio,d)/(dias.length-1));
  // serie de métricas: valor por sesión (absoluto o % de su media previa)
  const val=(pt,k)=>{ const v=raw(pt.pr,k).real; if(v==null) return null; return abs? v : (ref[k]? v/ref[k]*100 : null); };
  const metY = mets.map(k=> pts.map(pt=>val(pt,k)));
  const acwrY = acwrs.map(k=> dias.map(d=> acwrDia(l.dorsal, ACWR_SERIES[k].met, d)));
  const lv = metY.flat().filter(v=>v!=null);
  let lmax = Math.max(abs? 1 : 120, ...lv)*1.06;
  const lt=niceTicks(0,lmax,5); lmax=lt[lt.length-1];
  const YL=v=> mT+ih-ih*v/lmax;
  const rmax0=Math.max(1.6, ...acwrY.flat())*1.05;
  const rt=niceTicks(0,rmax0,4); const rmax=rt[rt.length-1];
  const YR=v=> mT+ih-ih*v/rmax;

  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"Evolución durante la lesión"});
  const g=el("g",{class:"grid"}), ax=el("g",{class:"axis"});
  if(mets.length){
    lt.forEach(t=>{ g.appendChild(el("line",{x1:mL,x2:W-mR,y1:YL(t),y2:YL(t)}));
      ax.appendChild(el("text",{x:mL-8,y:YL(t)+3.5,"text-anchor":"end"}, fmtN(t,0)+(abs?"":"%"))); });
    ax.appendChild(el("text",{class:"axis-lab",x:4,y:mT-6}, abs? (METRICS[mets[0]].u||METRICS[mets[0]].lab) : "% media previa"));
  }
  if(acwrs.length){
    svg.appendChild(el("rect",{class:"band-fill", x:mL, y:YR(1.3), width:iw, height:YR(0.8)-YR(1.3)}));
    rt.forEach(t=>{ if(!mets.length) g.appendChild(el("line",{x1:mL,x2:W-mR,y1:YR(t),y2:YR(t)}));
      ax.appendChild(el("text",{x:W-mR+8,y:YR(t)+3.5,"text-anchor":"start"}, fmtN(t,1))); });
    ax.appendChild(el("text",{class:"axis-lab",x:W-mR-4,y:mT-6,"text-anchor":"start"},"ACWR"));
  }
  svg.append(g, ax);
  if(mets.length && !abs) svg.appendChild(el("line",{class:"ref-line",x1:mL,x2:W-mR,y1:YL(100),y2:YL(100)}));
  if(abs && ref[mets[0]]!=null) svg.appendChild(el("line",{class:"ref-line",x1:mL,x2:W-mR,y1:YL(ref[mets[0]]),y2:YL(ref[mets[0]])}));
  // marca de alta
  if(l.alta){
    svg.appendChild(el("line",{x1:X(l.alta),x2:X(l.alta),y1:mT,y2:mT+ih,stroke:"var(--sem-ok)","stroke-width":1.5,"stroke-dasharray":"2 3"}));
    svg.appendChild(el("text",{x:X(l.alta)-4,y:mT+10,"text-anchor":"end",fill:"var(--sem-ok)","font-size":"10.5","font-weight":"600"},"Alta"));
  }
  acwrs.forEach((k,j)=> svg.appendChild(el("path",{class:"serie", stroke:LES_COLORS[k], "stroke-dasharray":"5 3", "stroke-width":1.8,
    d:line(acwrY[j].map((v,i)=>[X(dias[i]),YR(v)]))})));
  mets.forEach((k,j)=>{
    svg.appendChild(el("path",{class:"serie", stroke:LES_COLORS[k], d:line(metY[j].map((v,i)=> v==null?null:[X(pts[i].s.date),YL(v)]))}));
    metY[j].forEach((v,i)=>{ if(v==null) return;
      svg.appendChild(el("circle",{class:"dot",cx:X(pts[i].s.date),cy:YL(v),r:pts[i].s.isExtra?4:3.2,fill:LES_COLORS[k]})); });
  });
  // eje x: una etiqueta por semana
  const xa=el("g",{class:"axis"});
  dias.forEach((d,i)=>{ if(i%cadaX===0 || (i===dias.length-1 && i%cadaX>cadaX/2))
    xa.appendChild(el("text",{x:X(d),y:H-mB+16,"text-anchor":"middle"}, d.slice(8,10)+"/"+d.slice(5,7))); });
  svg.appendChild(xa);

  // tooltip por día
  const box=el("div",{class:"chart-box"}); box.appendChild(svg);
  const tip=el("div",{class:"tt"}); box.appendChild(tip);
  const cross=el("line",{class:"crosshair",y1:mT,y2:mT+ih,x1:mL,x2:mL,opacity:0}); svg.appendChild(cross);
  const hit=el("rect",{x:mL,y:mT,width:iw,height:ih,fill:"transparent"}); svg.appendChild(hit);
  hit.addEventListener("pointermove", ev=>{
    const r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(dias.length-1, Math.round((px-mL)/iw*(dias.length-1))));
    const d=dias[i], pt=pts.find(p=>p.s.date===d);
    cross.setAttribute("x1",X(d)); cross.setAttribute("x2",X(d)); cross.setAttribute("opacity",1);
    const rows=[];
    mets.forEach(k=>{ if(!pt) return; const v=raw(pt.pr,k).real; if(v==null) return;
      rows.push(`<div class="row"><span><i style="background:${LES_COLORS[k]}"></i>${METRICS[k].lab}</span><b>${fmtN(v,METRICS[k].dec)}${ref[k]?` · ${Math.round(v/ref[k]*100)}%`:""}</b></div>`); });
    acwrs.forEach((k,j)=> rows.push(`<div class="row"><span><i style="background:${LES_COLORS[k]}"></i>${ACWR_SERIES[k].lab}</span><b>${fmtN(acwrY[j][i],2)}</b></div>`));
    tip.innerHTML=`<h4><span>${fDate(d)}</span><span class="muted">día ${diasEntre(l.baja,d)+1} de baja</span></h4>`+
      `<div class="row" style="margin-bottom:3px"><span>${pt? pt.s.key+" · "+tipoPunto(pt,l) : "Sin sesión"}</span></div>`+rows.join("");
    tip.style.opacity=1;
    tip.style.left=Math.min(r.width-190, Math.max(0, X(d)/W*r.width+12))+"px"; tip.style.top="10px";
  });
  hit.addEventListener("pointerleave", ()=>{ tip.style.opacity=0; cross.setAttribute("opacity",0); });
  return box;
}

function panelGraficoLesion(l, pts, ref){
  const cfg = lesSel[l.id] || (lesSel[l.id] = {sel:new Set(["distancia","hsr","acwr_pl"]), abs:false});
  const cont=el("div");
  const pintar=()=>{
    cont.innerHTML="";
    const bar=el("div",{class:"les-pick"});
    const grupo=(tit, claves, lab)=>{
      const gdiv=el("div",{class:"fgroup"}); gdiv.appendChild(el("span",{},tit));
      const box=el("div",{class:"chips"});
      claves.forEach(k=>{
        const on=cfg.sel.has(k);
        const b=el("button",{class:"chip sm","aria-pressed":on});
        b.innerHTML=`<i class="sw" style="background:${LES_COLORS[k]}"></i>${lab(k)}`;
        b.onclick=()=>{ on? cfg.sel.delete(k) : cfg.sel.add(k); pintar(); };
        box.appendChild(b);
      });
      gdiv.appendChild(box); return gdiv;
    };
    bar.appendChild(grupo("Métricas", LES_METRICS, k=>METRICS[k].lab));
    bar.appendChild(grupo("ACWR", Object.keys(ACWR_SERIES), k=>ACWR_SERIES[k].lab.replace("ACWR ","")));
    const nMet=[...cfg.sel].filter(k=>LES_METRICS.includes(k)).length;
    const esc=el("div",{class:"fgroup"}); esc.appendChild(el("span",{},"Escala"));
    const ebox=el("div",{class:"chips"});
    [["pct","% media previa"],["abs","Valor absoluto"]].forEach(([v,t])=>{
      const b=el("button",{class:"chip sm","aria-pressed":(v==="abs")===(cfg.abs&&nMet===1)},t);
      if(v==="abs" && nMet!==1){ b.setAttribute("disabled",""); b.title="Elige una sola métrica para verla en valor absoluto"; }
      b.onclick=()=>{ cfg.abs=(v==="abs"); pintar(); };
      ebox.appendChild(b);
    });
    esc.appendChild(ebox); bar.appendChild(esc);
    cont.appendChild(bar);
    if(!cfg.sel.size){ cont.appendChild(el("p",{class:"note"},"Elige al menos una métrica o un ACWR.")); return; }
    cont.appendChild(chartLesion(l, pts, ref, cfg));
    cont.appendChild(el("p",{class:"note"},
      `Puntos = sesiones con GPS (más grandes: Extra). Línea gris discontinua = su media en las 4 semanas previas a la baja (${ref.n} sesiones con el grupo)`+
      `. ACWR (discontinuo, eje derecho) calculado día a día: carga de 7 días ÷ carga de 28 días; franja verde 0,8–1,3.`));
  };
  pintar();
  return cont;
}

function fichaLesion(l){
  const d=el("details",{class:"les"});
  const fin = l.alta || HOY;
  const dias = diasEntre(l.baja, fin) + (l.alta?0:1);
  const pts = puntosLesion(l);
  const nSes = pts.filter(pt=>!pt.alta).length;
  const sum=el("summary");
  sum.innerHTML =
    `<span class="nm">#${l.dorsal} ${NAME[l.dorsal]||l.jugador}</span>`+
    `<span><span class="lb">Lesión</span>${l.tipo||"–"}</span>`+
    `<span><span class="lb">Baja</span><span class="mono">${fDate(l.baja)}</span></span>`+
    `<span><span class="lb">Alta</span>${l.alta?`<span class="mono">${fDate(l.alta)}</span>`:`<span class="tag-les baja">Abierta</span>`}</span>`+
    `<span style="text-align:right"><span class="lb">${l.alta?"Duración":"Lleva"}</span><b class="mono">${dias} días</b> <span class="muted">· ${nSes} ses. readaptación</span></span>`;
  d.appendChild(sum);
  d.addEventListener("toggle", ()=>{
    if(!d.open || d.dataset.ok) return;
    d.dataset.ok="1";
    const body=el("div",{class:"les-body"});
    const ref=refPrevia(l);
    if(!pts.length){
      body.appendChild(el("p",{class:"note", style:"padding-top:10px"},"Todavía no ha empezado la readaptación: no hay sesiones con GPS desde la baja."));
    } else {
      body.appendChild(panelGraficoLesion(l, pts, ref));
      const wrap=el("div",{class:"tbl-scroll sticky-col"});
      const tb=el("table");
      tb.innerHTML=`<thead><tr><th>Fecha</th><th>Sesión</th><th style="text-align:left">Tipo</th><th>Duración</th>`+
        LES_METRICS.map((k,i)=>`<th${i===0?' class="grp-start"':''}>${METRICS[k].lab}</th>`).join("")+
        `<th class="grp-start">ACWR PL</th><th>ACWR HSR</th><th>ACWR Spr.</th></tr></thead>`;
      const tbody=el("tbody");
      pts.forEach(pt=>{
        const cells=[`<td class="mono">${fDate(pt.s.date)}</td>`, `<td>${pt.s.key}</td>`,
          `<td style="text-align:left"><span class="tag-les ${pt.alta?"alta":"rehab"}">${tipoPunto(pt,l)}</span></td>`,
          `<td class="mono">${pt.pr.dur!=null?fmtN(pt.pr.dur,0)+"′":"–"}</td>`];
        LES_METRICS.forEach((k,i)=>{ const v=raw(pt.pr,k).real;
          cells.push(`<td class="mono${i===0?" grp-start":""}">${v!=null?fmtN(v,METRICS[k].dec):"–"}</td>`); });
        Object.values(ACWR_SERIES).forEach((a,i)=> cells.push(`<td class="mono${i===0?" grp-start":""}">${fmtN(acwrDia(l.dorsal,a.met,pt.s.date),2)}</td>`));
        const tr=el("tr"); tr.innerHTML=cells.join(""); tbody.appendChild(tr);
      });
      const refCells=[`<td>Media previa</td>`,`<td></td>`,`<td style="text-align:left" class="muted">4 semanas antes</td>`,`<td></td>`];
      LES_METRICS.forEach((k,i)=> refCells.push(`<td class="mono${i===0?" grp-start":""}">${ref[k]!=null?fmtN(ref[k],METRICS[k].dec):"–"}</td>`));
      refCells.push(`<td class="grp-start"></td><td></td><td></td>`);
      const trr=el("tr",{class:"total"}); trr.innerHTML=refCells.join(""); tbody.appendChild(trr);
      tb.appendChild(tbody); wrap.appendChild(tb); body.appendChild(wrap);
    }
    if(l.nota) body.appendChild(el("p",{class:"note"}, l.nota));
    d.appendChild(body);
  });
  return d;
}
function viewLesionados(root){
  const p=panel("Lesionados",
    "Todas las lesiones de la temporada: las abiertas arriba y las cerradas debajo. Despliega cada una para ver la evolución de su carga durante la baja (sesiones de readaptación y Extra) frente a su media antes de lesionarse.");
  const abiertas=LESIONES.filter(l=>!l.alta).sort((a,b)=> a.baja<b.baja?1:-1);
  const cerradas=LESIONES.filter(l=>l.alta).sort((a,b)=> a.alta<b.alta?1:-1);
  const durs=cerradas.map(l=>diasEntre(l.baja,l.alta));
  const mini=el("div",{class:"mini-kpis"});
  mini.innerHTML=[
    {n:abiertas.length, l:"Bajas abiertas"},
    {n:cerradas.length, l:"Altas"},
    {n:LESIONES.length, l:"Lesiones temporada"},
    {n:durs.length?fmtN(durs.reduce((a,b)=>a+b,0)/durs.length,0):"–", sm:" días", l:"Duración media (cerradas)"},
  ].map(k=>`<div class="kpi"><div class="n">${k.n}${k.sm?`<small>${k.sm}</small>`:""}</div><div class="l">${k.l}</div></div>`).join("");
  p.appendChild(mini);
  if(!LESIONES.length){ p.appendChild(el("p",{class:"note"},"No hay lesiones registradas.")); root.appendChild(p); return; }
  [["Abiertas",abiertas],["Cerradas",cerradas]].forEach(([tit,lst])=>{
    if(!lst.length) return;
    p.appendChild(el("h3",{class:"les-h"}, `${tit} (${lst.length})`));
    lst.forEach(l=> p.appendChild(fichaLesion(l)));
  });
  p.appendChild(el("p",{class:"note", style:"padding-top:12px"},
    "Una lesión va de la baja hasta el primer día que vuelve a entrenar con el grupo (alta). El gráfico y la tabla empiezan en la primera sesión de readaptación."));
  root.appendChild(p);
}

function radarChart(series, labels){
  const N=labels.length, W=440,H=360,cx=W/2,cy=H/2+6,R=118;
  const maxes=labels.map((_,i)=> Math.max(...series.map(s=>s.vals[i]||0))*1.15 || 1);
  const ang=i=> -Math.PI/2 + i*2*Math.PI/N;
  const pt=(i,val)=>[cx+Math.cos(ang(i))*R*(val/maxes[i]), cy+Math.sin(ang(i))*R*(val/maxes[i])];
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"Gráfica radar"});
  [0.25,0.5,0.75,1].forEach(f=>{
    const d=labels.map((_,i)=>{ const p=[cx+Math.cos(ang(i))*R*f, cy+Math.sin(ang(i))*R*f]; return p.join(","); }).join(" L");
    svg.appendChild(el("path",{d:"M"+d+" Z", fill:"none", stroke:"var(--border)","stroke-width":1}));
  });
  labels.forEach((lab,i)=>{
    const o=[cx+Math.cos(ang(i))*R, cy+Math.sin(ang(i))*R];
    svg.appendChild(el("line",{x1:cx,y1:cy,x2:o[0],y2:o[1], stroke:"var(--border)","stroke-width":1}));
    const lx=cx+Math.cos(ang(i))*(R+22), ly=cy+Math.sin(ang(i))*(R+22);
    svg.appendChild(el("text",{x:lx, y:ly+3, "text-anchor": Math.abs(lx-cx)<8?"middle":(lx>cx?"start":"end"), "font-size":10.5, fill:"var(--ink-2)"}, lab));
  });
  series.forEach(s=>{
    const d=s.vals.map((v,i)=> pt(i,v).join(",")).join(" L");
    svg.appendChild(el("path",{d:"M"+d+" Z", fill:s.color, "fill-opacity":.12, stroke:s.color, "stroke-width":2}));
    s.vals.forEach((v,i)=>{ const q=pt(i,v); svg.appendChild(el("circle",{cx:q[0],cy:q[1],r:2.6,fill:s.color})); });
  });
  return svg;
}
