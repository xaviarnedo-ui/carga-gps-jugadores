<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carga GPS · Dashboard</title>
<meta name="description" content="Dashboard analítico de carga GPS: evolución, microciclos, tipo de sesión, jugadores y comparador.">
<meta name="theme-color" content="#16305f">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/icon-192.png?v=53">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f6; --surface-3:#e7ebf2;
    --border:#dde3ec; --border-strong:#c9d1de;
    --ink:#1a2130; --ink-2:#576078; --ink-3:#8a92a6;
    --accent:#16305f; --accent-2:#1d5fd4; --on-accent:#ffffff;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#e34948;
    --sem-corto:#5b9bd5; --sem-ok:#1baf7a; --sem-pasado:#eda100; --sem-alto:#e34948; --sem-na:#c4cad6;
    --band:rgba(27,175,122,.12);
    --shadow:0 1px 2px rgba(20,30,55,.06), 0 8px 24px -12px rgba(20,30,55,.14);
    --r:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0d121c; --surface:#151d2b; --surface-2:#1c2536; --surface-3:#232d40;
      --border:#2a3446; --border-strong:#3a4557;
      --ink:#e8ecf5; --ink-2:#9aa5bc; --ink-3:#6c7690;
      --accent:#3a5c94; --accent-2:#6ea8ff; --on-accent:#ffffff;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#e66767;
      --sem-corto:#4a86c4; --sem-ok:#199e70; --sem-pasado:#c98500; --sem-alto:#e05656; --sem-na:#3a4557;
      --band:rgba(25,158,112,.16);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0d121c; --surface:#151d2b; --surface-2:#1c2536; --surface-3:#232d40;
    --border:#2a3446; --border-strong:#3a4557;
    --ink:#e8ecf5; --ink-2:#9aa5bc; --ink-3:#6c7690;
    --accent:#3a5c94; --accent-2:#6ea8ff; --on-accent:#ffffff;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#e66767;
    --sem-corto:#4a86c4; --sem-ok:#199e70; --sem-pasado:#c98500; --sem-alto:#e05656; --sem-na:#3a4557;
    --band:rgba(25,158,112,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Barlow Condensed", "Barlow", sans-serif; font-weight:600; margin:0; line-height:1.1; text-wrap:balance}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
  button{font-family:inherit; cursor:pointer}
  a{color:var(--accent-2)}
  :focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:4px}

  .wrap{max-width:1180px; margin:0 auto; padding:0 20px}

  /* ---- header ---- */
  header{background:var(--accent); color:var(--on-accent)}
  .head-in{display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:18px 0 16px; flex-wrap:wrap}
  .brand{display:flex; align-items:baseline; gap:12px}
  .brand h1{font-size:26px; letter-spacing:.5px; text-transform:uppercase; color:#fff}
  .brand .sub{font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.72)}
  .kpis{display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; margin:-8px 0 0}
  .kpi{background:var(--surface); padding:12px 14px}
  .kpi .n{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:26px; letter-spacing:.5px}
  .kpi .l{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-top:1px}
  .kpi .n small{font-size:13px; font-weight:600; color:var(--ink-2); letter-spacing:0}

  /* ---- filter bar ---- */
  .filters{position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); margin-top:16px}
  @supports (backdrop-filter:blur(1px)){ .filters{background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(8px)} }
  .filters-in{display:flex; flex-wrap:wrap; gap:14px 22px; padding:11px 0}
  .fgroup{display:flex; flex-direction:column; gap:4px}
  .fgroup > span{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
  .chips{display:flex; gap:4px; flex-wrap:wrap}
  .chip{border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-2); border-radius:999px; padding:3px 10px; font-size:12.5px; font-weight:500; line-height:1.4; transition:border-color .1s, color .1s}
  .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
  .chip:not([aria-pressed="true"]):hover{border-color:var(--accent-2); color:var(--ink)}
  .chip.sm{padding:2px 8px; font-size:11.5px}
  select{font-family:inherit; font-size:12.5px; padding:4px 8px; border:1px solid var(--border-strong); border-radius:7px; background:var(--surface); color:var(--ink)}

  /* ---- tabs ---- */
  .tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin:18px 0 0; overflow-x:auto}
  .tab{border:0; background:transparent; color:var(--ink-2); font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:15.5px; letter-spacing:.04em; text-transform:uppercase; padding:9px 14px; border-bottom:2.5px solid transparent; white-space:nowrap; transition:color .1s, border-color .1s}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent-2)}

  main{padding:20px 0 60px}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow)}
  .panel-h{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:14px 16px 8px}
  .panel-h h2{font-size:19px}
  .panel-h p{margin:2px 0 0; font-size:12.5px; color:var(--ink-2); max-width:62ch}
  .legend{display:flex; gap:12px; flex-wrap:wrap; padding:4px 16px 12px; font-size:12px; color:var(--ink-2)}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px}
  .legend .ln{width:16px; height:0; border-top-width:2.5px; border-top-style:solid; border-radius:0; vertical-align:4px}

  .chart-box{position:relative; padding:0 6px 10px}
  svg{display:block; width:100%; height:auto; overflow:visible}
  .grid line{stroke:var(--border)}
  .axis text{fill:var(--ink-3); font-size:10.5px}
  .axis-lab{fill:var(--ink-2); font-size:11px; font-weight:500}
  .mcband{fill:var(--surface-2)}
  .mclab{fill:var(--ink-3); font-size:10px; font-weight:600; letter-spacing:.06em}
  .serie{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
  .serie.team{stroke:var(--ink); stroke-width:2.6}
  .band-fill{fill:var(--band)}
  .band-line{stroke:var(--ink-3); stroke-dasharray:3 3; stroke-width:1.3; fill:none}

  .tt{position:absolute; pointer-events:none; z-index:5; background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; box-shadow:var(--shadow); padding:8px 10px; font-size:12px; min-width:150px; opacity:0; transition:opacity .1s}
  .tt h4{font-family:"Barlow Condensed",sans-serif; font-size:13.5px; margin-bottom:4px; display:flex; justify-content:space-between; gap:10px}
  .tt .row{display:flex; justify-content:space-between; gap:12px; color:var(--ink-2)}
  .tt .row b{color:var(--ink); font-weight:600}
  .tt .row i{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:5px}

  .crosshair{stroke:var(--border-strong); stroke-width:1}
  .dot{stroke:var(--surface); stroke-width:1.5}

  table{border-collapse:collapse; width:100%; font-size:12.5px}
  th,td{text-align:right; padding:5px 9px; border-bottom:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  thead th{font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr.total{font-weight:700}
  tbody tr.total td{background:var(--surface-2); border-top:2px solid var(--border-strong)}
  .tbl-scroll{overflow-x:auto; padding:2px 16px 16px}
  .tbl-scroll.sticky-col th:first-child,.tbl-scroll.sticky-col td:first-child{position:sticky; left:0; background:var(--surface); z-index:1}
  .tbl-scroll.sticky-col tbody tr:hover td:first-child{background:var(--surface-2)}
  .tbl-scroll.sticky-col tbody tr.total td:first-child{background:var(--surface-2)}
  .grp-start{border-left:1px solid var(--border)}
  .badge-pend{display:inline-block; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-3); font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; vertical-align:1px}

  .hm-cell{cursor:pointer; transition:transform .08s}
  .hm-cell:hover{transform:scale(1.04)}
  .hm-val{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500}

  .mini-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin:0 16px 14px}
  .mini-kpis .kpi{padding:10px 12px}
  .mini-kpis .kpi .n{font-size:19px}
  .split{display:grid; grid-template-columns:1.35fr 1fr; gap:16px}
  .sub-h{font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:14px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2); margin:0 0 8px}
  .pick{display:flex; flex-wrap:wrap; gap:4px; padding:0 16px 12px}
  .muted{color:var(--ink-3); font-size:12px}
  .note{font-size:11.5px; color:var(--ink-3); padding:0 16px 14px}
  .pos-D{color:var(--s1)} .pos-M{color:var(--s3)} .pos-DL{color:var(--s2)}

  @media (max-width:820px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .split{grid-template-columns:1fr}
    .brand h1{font-size:22px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div class="brand">
      <h1>Carga GPS</h1>
      <span class="sub" id="season-lab">AT Baleares</span>
    </div>
    <span class="sub" id="gen-lab"></span>
  </div>
</header>

<div class="wrap" style="margin-top:-10px; position:relative; z-index:2">
  <div class="kpis" id="kpis"></div>
</div>

<div class="filters">
  <div class="wrap filters-in" id="filters"></div>
</div>

<div class="wrap">
  <div class="tabs" id="tabs" role="tablist"></div>
</div>

<main class="wrap" id="view"></main>

<script src="data.js"></script>
<script>
"use strict";
function buildRAW(d){
  const METR=["distancia","hmld","hsr","sprint","acc","dec"];
  function dur2min(t){
    if(!t || typeof t!=="string" || t.indexOf(":")<0) return null;
    const p=t.split(":").map(Number);
    if(p.length===3) return Math.round((p[0]*60+p[1]+p[2]/60)*10)/10;
    if(p.length===2) return Math.round((p[0]+p[1]/60)*10)/10;
    return null;
  }
  const players={};
  d.refPartido.players.forEach(p=>{ players[p.dorsal]={d:p.dorsal,n:p.jugador,g:p.grupo}; });
  const ref={};
  d.refPartido.players.forEach(p=>{
    const o={}; METR.concat(["velMax"]).forEach(k=>{ o[k]=(p[k]===undefined?null:p[k]); }); ref[p.dorsal]=o;
  });
  const sessions=[];
  d.microciclos.slice().reverse().forEach(mk=>{
    const m=d[mk], meta=m.meta;
    m.orden.forEach(o=>{
      const key=o.key, isMatch=(o.tipo!=="sesion");
      const src=isMatch? m.partidos[key] : m.sesiones[key];
      const row={mc:meta.n, mcTipo:meta.tipo, key:key, date:src.date,
        role: src.role || (isMatch?"Partido":null),
        isMatch:isMatch, rival:(src.rival||null), estado:meta.estado, semana:meta.semana, players:[]};
      src.players.forEach(pl=>{
        const dd=pl.dorsal;
        if(!players[dd]) players[dd]={d:dd,n:(pl.jugador||"?"),g:(pl.grupo||"?")};
        const mp={};
        METR.forEach(k=>{ const v=pl[k]; if(v && typeof v==="object") mp[k]=[(v.obj===undefined?null:v.obj), (v.real===undefined?null:v.real)]; });
        row.players.push({d:dd, dur:dur2min(pl.duracion), vmax:(pl.velMax===undefined?null:pl.velMax), pl:(pl.playerLoad===undefined?null:pl.playerLoad), m:mp});
      });
      sessions.push(row);
    });
  });
  const playerList=Object.keys(players).map(k=>players[k]).sort((a,b)=>a.d-b.d);
  return {
    meta:d.meta,
    players:playerList,
    ref:ref, refTeam:d.refPartido.teamAvg,
    coef:d.coeficientes.tipos, sessions:sessions,
  };
}
const RAW = buildRAW(window.GPS_DATA_ALL);

/* ---------- model ---------- */
const METRICS = {
  distancia:{lab:"Distancia", u:"m", dec:0},
  hmld:{lab:"HMLD", u:"m", dec:0},
  hsr:{lab:"HSR", u:"m", dec:0},
  sprint:{lab:"Sprints", u:"", dec:1},
  acc:{lab:"Aceleraciones", u:"", dec:1},
  dec:{lab:"Deceleraciones", u:"", dec:1},
  pl:{lab:"Player Load", u:"ua", dec:0, noObj:true},
  vmax:{lab:"Vel. máx", u:"km/h", dec:1, noObj:true, best:true},
};
const RADAR_METRICS = ["distancia","hmld","hsr","sprint","acc","dec"];
const NORMS = {
  abs:{lab:"Absoluto"},
  permin:{lab:"Por minuto"},
  pctobj:{lab:"% objetivo"},
  pctref:{lab:"% ref. partido"},
};
const GROUPS = {D:"DEF", M:"MED", DL:"DEL"};
const SERIES_COLORS = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];

// Los microciclos 1-7 fueron pretemporada: aunque el Excel etiquete sus sesiones
// como MD-4/MD-3/..., NO cuentan como tal (contexto y demandas distintos).
const PRESEASON_MC = 7;
// normalize the raw session role into a training-day bucket
function bucket(s){
  if(s.isMatch) return "Partido";
  if(s.mc <= PRESEASON_MC) return "Pretemp.";
  const r=(s.role||"").toUpperCase();
  if(r.startsWith("MD+") || r.includes("+1")) return "MD+1";
  if(r.startsWith("MD-")) return r;
  return "Otras";
}
const BUCKET_ORDER = ["MD+1","MD-4","MD-3","MD-2","MD-1","Partido","Otras","Pretemp."];

RAW.sessions.forEach((s,i)=>{ s.i=i; s.bucket=bucket(s); });
const PLAYERS = RAW.players;
const NAME = Object.fromEntries(PLAYERS.map(p=>[p.d, p.n]));
const POS = Object.fromEntries(PLAYERS.map(p=>[p.d, p.g]));
const REF = RAW.ref;
const MICROS = [...new Set(RAW.sessions.map(s=>s.mc))].sort((a,b)=>a-b);

/* ---------- state ---------- */
const state = {
  metric:"distancia", norm:"abs", group:"all",
  buckets:new Set(BUCKET_ORDER),
  players:new Set(),          // evolución overlay + comparador
  lens:"evolucion",
  hmPlayer:null,
};

/* ---------- value helpers ---------- */
function raw(pr, metric){
  if(metric==="pl") return {real:pr.pl, obj:null};
  if(metric==="vmax") return {real:pr.vmax, obj:null};
  const m=pr.m[metric]; return m? {obj:m[0], real:m[1]} : {obj:null, real:null};
}
// partidos OFICIALES = liga (clave "Jx"); los PTx de pretemporada no cuentan aquí
const isOficial = s => s.isMatch && /^J\d/.test(s.key);
const officialMatches = () => RAW.sessions.filter(isOficial);
// suma/media/mejor de un parámetro entre los jugadores que jugaron ese partido
function matchStat(s, metric){
  let sum=0, n=0, best=null;
  s.players.forEach(pr=>{
    const v=raw(pr,metric).real;
    if(v!=null && isFinite(v)){ sum+=v; n++; if(best==null||v>best) best=v; }
  });
  return n? {sum, mean:sum/n, n, best} : {sum:null, mean:null, n:0, best:null};
}
function refVal(dorsal, metric){
  const r=REF[dorsal]; if(!r) return null;
  return r[metric==="vmax"?"velMax":metric] ?? null;
}
function normalize(val, kind, pr, metric){
  if(val==null) return null;
  if(kind==="abs") return val;
  if(kind==="permin") return pr.dur ? val/pr.dur : null;
  if(kind==="pctobj"){ const o=raw(pr,metric).obj; return o ? val/o*100 : null; }
  if(kind==="pctref"){ const r=refVal(pr.d,metric); return r ? val/r*100 : null; }
}
const inGroup = pr => state.group==="all" || pr.g===state.group || POS[pr.d]===state.group;

// mean of a per-session team value (real, normalized)
function teamPoint(s, metric, kind, dorsalSet){
  let sum=0,n=0;
  for(const pr of s.players){
    if(dorsalSet){ if(!dorsalSet.has(pr.d)) continue; }
    else if(!inGroup(pr)) continue;
    const v=normalize(raw(pr,metric).real, kind, pr, metric);
    if(v!=null && isFinite(v)){ sum+=v; n++; }
  }
  return n? sum/n : null;
}
function teamObj(s, metric, kind){
  if(METRICS[metric].noObj) return null;
  let sum=0,n=0;
  for(const pr of s.players){
    if(!inGroup(pr)) continue;
    const o=raw(pr,metric).obj; if(o==null) continue;
    let v=o;
    if(kind==="permin") v = pr.dur? o/pr.dur : null;
    else if(kind==="pctobj") v=100;
    else if(kind==="pctref"){ const r=refVal(pr.d,metric); v=r? o/r*100 : null; }
    if(v!=null && isFinite(v)){ sum+=v; n++; }
  }
  return n? sum/n : null;
}
function playerPoint(s, dorsal, metric, kind){
  const pr=s.players.find(p=>p.d===dorsal);
  if(!pr) return null;
  return normalize(raw(pr,metric).real, kind, pr, metric);
}
function activeSessions(){
  return RAW.sessions.filter(s=>state.buckets.has(s.bucket));
}

/* ---------- formatting ---------- */
const fmt = (v,m)=> v==null ? "–" : new Intl.NumberFormat("es-ES",{maximumFractionDigits:METRICS[m]?.dec ?? 0}).format(v);
const fmtN = (v,d=0)=> v==null||!isFinite(v) ? "–" : new Intl.NumberFormat("es-ES",{maximumFractionDigits:d}).format(v);
function unitLabel(){
  if(state.norm==="pctobj"||state.norm==="pctref") return "%";
  if(state.norm==="permin") return (METRICS[state.metric].u||"u")+"/min";
  return METRICS[state.metric].u;
}
function niceTicks(min,max,count=5){
  const span=max-min || 1;
  const step0=span/count;
  const mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const t=[]; for(let v=lo;v<=hi+1e-9;v+=step) t.push(+v.toFixed(6));
  return t;
}

/* ---------- element helper (HTML + SVG) ---------- */
const NS="http://www.w3.org/2000/svg";
const SVG_TAGS=new Set(["svg","g","path","circle","rect","line","text","polygon"]);
function el(tag, attrs={}, kids=[]){
  const n=SVG_TAGS.has(tag) ? document.createElementNS(NS,tag) : document.createElement(tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  (Array.isArray(kids)?kids:[kids]).forEach(c=> c!=null && n.appendChild(typeof c==="string"?document.createTextNode(c):c));
  return n;
}

/* ---------- render shell ---------- */
function renderShell(){
  document.getElementById("season-lab").textContent = "AT Baleares · Temporada "+(RAW.meta.temporada||"");
  document.getElementById("gen-lab").textContent = "Actualizado "+(RAW.meta.generado||"");

  // KPIs
  const ses = RAW.sessions.filter(s=>!s.isMatch);
  let realSum=0, objSum=0;
  RAW.sessions.forEach(s=>{ if(s.isMatch) return;
    s.players.forEach(pr=> RADAR_METRICS.forEach(m=>{
      const c=raw(pr,m); if(c.obj!=null && c.real!=null){ realSum+=c.real; objSum+=c.obj; }
    }));
  });
  const cumpl = objSum? realSum/objSum*100 : null;
  let bestV=0, bestName="";
  RAW.sessions.forEach(s=> s.players.forEach(pr=>{ if(pr.vmax>bestV){ bestV=pr.vmax; bestName=NAME[pr.d]; }}));
  const kpis=[
    {n:ses.length, l:"Sesiones"},
    {n:MICROS.length, l:"Microciclos"},
    {n:(cumpl!=null?fmtN(cumpl,0)+"%":"–"), l:"Cumplimiento medio obj."},
    {n:fmtN(bestV,1), sm:" km/h", l:"Vel. máx · "+(bestName.split(",")[0]||"")},
    {n:PLAYERS.length, l:"Jugadores"},
  ];
  document.getElementById("kpis").innerHTML = kpis.map(k=>
    `<div class="kpi"><div class="n">${k.n}${k.sm?`<small>${k.sm}</small>`:""}</div><div class="l">${k.l}</div></div>`
  ).join("");

  // Filters
  const f=document.getElementById("filters");
  f.innerHTML="";
  f.appendChild(fSelect("Métrica","metric",Object.entries(METRICS).map(([k,v])=>[k,v.lab])));
  f.appendChild(fSelect("Normalización","norm",Object.entries(NORMS).map(([k,v])=>[k,v.lab])));
  f.appendChild(fChips("Grupo","group",[["all","Todos"],...Object.entries(GROUPS)],false));
  f.appendChild(fBucketChips());

  // Tabs
  const tabDefs=[
    ["evolucion","Evolución"],["microciclos","Microciclos"],
    ["tipo","Tipo de sesión"],["partidos","Partidos"],
    ["jugadores","Jugadores"],["comparador","Comparador"],
  ];
  const t=document.getElementById("tabs"); t.innerHTML="";
  tabDefs.forEach(([k,lab])=>{
    const b=el("button",{class:"tab",role:"tab","aria-selected":state.lens===k, "data-k":k});
    b.textContent=lab;
    b.onclick=()=>{ state.lens=k; renderShell(); renderView(); };
    t.appendChild(b);
  });
  renderView();
}
function fSelect(label, key, opts){
  const g=el("label",{class:"fgroup"}); g.appendChild(el("span",{},label));
  const s=el("select");
  opts.forEach(([v,l])=>{ const o=el("option",{value:v},l); if(state[key]===v)o.selected=true; s.appendChild(o); });
  s.onchange=()=>{ state[key]=s.value; renderView(); };
  g.appendChild(s); return g;
}
function fChips(label, key, opts, multi){
  const g=el("label",{class:"fgroup"}); g.appendChild(el("span",{},label));
  const box=el("div",{class:"chips"});
  opts.forEach(([v,l])=>{
    const b=el("button",{class:"chip","aria-pressed":state[key]===v},l);
    b.onclick=()=>{ state[key]=v; renderShell(); renderView(); };
    box.appendChild(b);
  });
  g.appendChild(box); return g;
}
function fBucketChips(){
  const g=el("label",{class:"fgroup"}); g.appendChild(el("span",{},"Tipo de sesión"));
  const box=el("div",{class:"chips"});
  BUCKET_ORDER.forEach(bk=>{
    if(!RAW.sessions.some(s=>s.bucket===bk)) return;
    const b=el("button",{class:"chip sm","aria-pressed":state.buckets.has(bk)},bk);
    b.onclick=()=>{ state.buckets.has(bk)?state.buckets.delete(bk):state.buckets.add(bk); renderShell(); renderView(); };
    box.appendChild(b);
  });
  g.appendChild(box); return g;
}

/* ---------- views ---------- */
function renderView(){
  const v=document.getElementById("view"); v.innerHTML="";
  ({evolucion:viewEvolucion, microciclos:viewMicrociclos, tipo:viewTipo, partidos:viewPartidos,
    jugadores:viewJugadores, comparador:viewComparador}[state.lens])(v);
}
function panel(title, desc){
  const p=el("div",{class:"panel"});
  const h=el("div",{class:"panel-h"});
  const l=el("div"); l.appendChild(el("h2",{},title));
  if(desc) l.appendChild(el("p",{},desc));
  h.appendChild(l); p.appendChild(h);
  return p;
}
function legendRow(items){
  const d=el("div",{class:"legend"});
  items.forEach(it=>{
    const s=el("span");
    s.innerHTML = (it.line?`<i class="ln" style="border-top-color:${it.c}"></i>`:`<i style="background:${it.c}"></i>`)+it.t;
    d.appendChild(s);
  });
  return d;
}

/* ===== 1 · EVOLUCIÓN ===== */
function viewEvolucion(root){
  const M=METRICS[state.metric];
  const sessions=activeSessions();
  const showBand = !M.noObj && (state.norm==="abs"||state.norm==="pctobj"||state.norm==="permin"||state.norm==="pctref");
  const p=panel("Evolución de la carga",
    `${M.lab} · ${NORMS[state.norm].lab.toLowerCase()} — media del equipo por sesión, en orden cronológico. La banda verde es el objetivo.`);

  const picked=[...state.players];
  p.appendChild(legendRow([
    {c:"var(--ink)", t:"Media equipo", line:true},
    ...(showBand?[{c:"var(--sem-ok)", t:"Objetivo"}]:[]),
    ...picked.map((d,i)=>({c:SERIES_COLORS[i%6], t:NAME[d].split(",")[0], line:true})),
  ]));

  // player picker
  const pick=el("div",{class:"pick"});
  PLAYERS.forEach(pl=>{
    const on=state.players.has(pl.d);
    const b=el("button",{class:"chip sm","aria-pressed":on, title:pl.n},"#"+pl.d+" "+pl.n.split(",")[0]);
    b.onclick=()=>{
      if(on) state.players.delete(pl.d);
      else { if(state.players.size>=6) return; state.players.add(pl.d); }
      renderView();
    };
    pick.appendChild(b);
  });
  p.appendChild(pick);

  // ---- build series ----
  const xs = sessions.map((s,i)=>i);
  const teamY = sessions.map(s=> teamPoint(s, state.metric, state.norm));
  const objY  = showBand ? sessions.map(s=> teamObj(s, state.metric, state.norm)) : [];
  const playerY = picked.map(d=> sessions.map(s=> playerPoint(s, d, state.metric, state.norm)));

  const allV=[...teamY, ...objY, ...playerY.flat()].filter(v=>v!=null && isFinite(v));
  if(!allV.length){ p.appendChild(el("p",{class:"note"},"Sin datos para esta combinación de filtros.")); root.appendChild(p); return; }
  let vmin=Math.min(...allV), vmax=Math.max(...allV);
  if(state.norm==="pctobj"){ vmin=Math.min(vmin,80); vmax=Math.max(vmax,120); }
  const ticks=niceTicks(Math.min(vmin,0)===0&&vmin>=0?0:vmin, vmax, 5);
  vmin=ticks[0]; vmax=ticks[ticks.length-1];

  const W=980, H=380, mL=54, mR=16, mT=26, mB=64;
  const iw=W-mL-mR, ih=H-mT-mB;
  const X = i => mL + (sessions.length<=1?iw/2:iw*i/(sessions.length-1));
  const Y = v => mT + ih - ih*(v-vmin)/(vmax-vmin);

  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"Gráfica de evolución"});

  // microciclo bands
  let seg=[]; sessions.forEach((s,i)=>{ (seg[s.mc]=seg[s.mc]||[]).push(i); });
  Object.entries(seg).forEach(([mc,idxs],k)=>{
    if(k%2===0){
      const x0=X(idxs[0])-(X(1)-X(0))/2, x1=X(idxs[idxs.length-1])+(X(1)-X(0))/2;
      svg.appendChild(el("rect",{class:"mcband", x:Math.max(mL,x0), y:mT, width:Math.min(x1,W-mR)-Math.max(mL,x0), height:ih, opacity:.6}));
    }
    const xc=(X(idxs[0])+X(idxs[idxs.length-1]))/2;
    svg.appendChild(el("text",{class:"mclab", x:xc, y:mT-10, "text-anchor":"middle"}, "M"+mc));
  });

  // grid + y axis
  const g=el("g",{class:"grid"});
  ticks.forEach(tk=> g.appendChild(el("line",{x1:mL, x2:W-mR, y1:Y(tk), y2:Y(tk)})));
  svg.appendChild(g);
  const ax=el("g",{class:"axis"});
  ticks.forEach(tk=> ax.appendChild(el("text",{x:mL-8, y:Y(tk)+3.5, "text-anchor":"end"}, fmtN(tk, state.norm==="permin"?1:0))));
  ax.appendChild(el("text",{class:"axis-lab", x:mL-40, y:mT-12}, unitLabel()));
  svg.appendChild(ax);

  // objective band
  if(showBand && objY.some(v=>v!=null)){
    if(state.norm==="pctobj"){
      svg.appendChild(el("rect",{class:"band-fill", x:mL, y:Y(110), width:iw, height:Y(90)-Y(110)}));
      svg.appendChild(el("line",{class:"band-line", x1:mL, x2:W-mR, y1:Y(100), y2:Y(100)}));
    } else {
      const dpath = line(objY.map((v,i)=> v==null?null:[X(i),Y(v)]));
      // simple filled ribbon +/-10%
      const up=line(objY.map((v,i)=> v==null?null:[X(i),Y(v*1.1)]));
      const dn=objY.map((v,i)=> v==null?null:[X(i),Y(v*0.9)]).filter(Boolean).reverse();
      if(up && dn.length){
        svg.appendChild(el("path",{class:"band-fill", d: up+" L"+dn.map(p=>p.join(",")).join(" L")+" Z"}));
      }
      svg.appendChild(el("path",{class:"band-line", d:dpath}));
    }
  }

  // player series
  playerY.forEach((ys,idx)=>{
    svg.appendChild(el("path",{class:"serie", d:line(ys.map((v,i)=> v==null?null:[X(i),Y(v)])), stroke:SERIES_COLORS[idx%6]}));
    ys.forEach((v,i)=> v!=null && svg.appendChild(el("circle",{class:"dot", cx:X(i), cy:Y(v), r:2.6, fill:SERIES_COLORS[idx%6]})));
  });
  // team series (on top)
  svg.appendChild(el("path",{class:"serie team", d:line(teamY.map((v,i)=> v==null?null:[X(i),Y(v)]))}));
  teamY.forEach((v,i)=>{
    if(v==null) return;
    const s=sessions[i];
    svg.appendChild(el(s.isMatch?"rect":"circle", s.isMatch
      ? {class:"dot", x:X(i)-3, y:Y(v)-3, width:6, height:6, fill:"var(--ink)", transform:`rotate(45 ${X(i)} ${Y(v)})`}
      : {class:"dot", cx:X(i), cy:Y(v), r:3, fill:"var(--ink)"}));
  });

  // x labels
  const xa=el("g",{class:"axis"});
  sessions.forEach((s,i)=>{
    const t=el("text",{x:X(i), y:H-mB+16, "text-anchor":"end", transform:`rotate(-42 ${X(i)} ${H-mB+16})`}, s.key);
    xa.appendChild(t);
  });
  svg.appendChild(xa);

  // hover
  const cross=el("line",{class:"crosshair", y1:mT, y2:mT+ih, x1:mL, x2:mL, opacity:0});
  svg.appendChild(cross);
  const box=el("div",{class:"chart-box"});
  box.appendChild(svg);
  const tip=el("div",{class:"tt"}); box.appendChild(tip);
  const hit=el("rect",{x:mL, y:mT, width:iw, height:ih, fill:"transparent"});
  svg.appendChild(hit);
  hit.addEventListener("pointermove", ev=>{
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*W;
    let i=Math.round((px-mL)/(iw/Math.max(1,sessions.length-1)));
    i=Math.max(0,Math.min(sessions.length-1,i));
    const s=sessions[i];
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i)); cross.setAttribute("opacity",1);
    const rows=[];
    if(teamY[i]!=null) rows.push(`<div class="row"><span><i style="background:var(--ink)"></i>Equipo</span><b>${fmtN(teamY[i], state.norm==="permin"?2:1)}</b></div>`);
    if(showBand && objY[i]!=null && state.norm!=="pctobj") rows.push(`<div class="row"><span>Objetivo</span><b>${fmtN(objY[i],1)}</b></div>`);
    playerY.forEach((ys,idx)=>{ if(ys[i]!=null) rows.push(`<div class="row"><span><i style="background:${SERIES_COLORS[idx%6]}"></i>${NAME[picked[idx]].split(",")[0]}</span><b>${fmtN(ys[i],1)}</b></div>`); });
    tip.innerHTML=`<h4><span>${s.key}</span><span class="muted">${s.bucket}</span></h4>`+
      `<div class="row" style="margin-bottom:3px"><span>M${s.mc}${s.rival?" · "+s.rival:""}</span><span class="muted">${s.date.slice(5)}</span></div>`+rows.join("");
    tip.style.opacity=1;
    const bx=X(i)/W*r.width;
    tip.style.left=Math.min(r.width-170, Math.max(0,bx+12))+"px";
    tip.style.top="12px";
  });
  hit.addEventListener("pointerleave", ()=>{ tip.style.opacity=0; cross.setAttribute("opacity",0); });

  p.appendChild(box);
  p.appendChild(el("p",{class:"note"},
    "Rombo = partido. Bandas verticales = microciclos. "+
    (M.noObj? "Esta métrica no tiene objetivo cargado (Player Load / Vel. máx)." : "")));
  root.appendChild(p);
}
function line(pts){
  let d="", pen=false;
  pts.forEach(pt=>{
    if(!pt){ pen=false; return; }
    d += (pen?" L":" M")+pt[0].toFixed(1)+","+pt[1].toFixed(1);
    pen=true;
  });
  return d.trim();
}

/* ===== 2 · MICROCICLOS ===== */
function viewMicrociclos(root){
  const M=METRICS[state.metric];
  const p=panel("Comparativa de microciclos",
    `${M.lab} acumulada por microciclo (suma de la media del equipo en cada sesión). Objetivo vs real y % de cumplimiento.`);

  const rows = MICROS.map(mc=>{
    const ss = RAW.sessions.filter(s=>s.mc===mc && !s.isMatch && state.buckets.has(s.bucket));
    let real=0, obj=0, hasObj=false, n=0;
    ss.forEach(s=>{
      const tv=teamPoint(s, state.metric, "abs"); if(tv!=null){ real+=tv; n++; }
      const to=teamObj(s, state.metric, "abs"); if(to!=null){ obj+=to; hasObj=true; }
    });
    return {mc, real, obj:hasObj?obj:null, n, tipo:(RAW.sessions.find(s=>s.mc===mc)||{}).mcTipo};
  }).filter(r=>r.n>0);

  if(!rows.length){ p.appendChild(el("p",{class:"note"},"Sin datos.")); root.appendChild(p); return; }
  p.appendChild(legendRow([{c:"var(--sem-na)",t:"Objetivo"},{c:"var(--s1)",t:"Real"}]));

  const W=980,H=340,mL=54,mR=16,mT=16,mB=42;
  const iw=W-mL-mR, ih=H-mT-mB;
  const vmax=Math.max(...rows.flatMap(r=>[r.real, r.obj||0]))*1.12 || 1;
  const ticks=niceTicks(0,vmax,5);
  const Y=v=> mT+ih - ih*v/ticks[ticks.length-1];
  const bw=iw/rows.length;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"Barras por microciclo"});
  const g=el("g",{class:"grid"});
  ticks.forEach(tk=>g.appendChild(el("line",{x1:mL,x2:W-mR,y1:Y(tk),y2:Y(tk)})));
  svg.appendChild(g);
  const ax=el("g",{class:"axis"});
  ticks.forEach(tk=>ax.appendChild(el("text",{x:mL-8,y:Y(tk)+3.5,"text-anchor":"end"}, fmtN(tk,0))));
  ax.appendChild(el("text",{class:"axis-lab",x:mL-40,y:mT-4}, METRICS[state.metric].u||"u"));
  svg.appendChild(ax);

  rows.forEach((r,i)=>{
    const x0=mL+bw*i, cx=x0+bw/2;
    if(r.obj!=null) svg.appendChild(el("rect",{x:cx-bw*0.34, y:Y(r.obj), width:bw*0.30, height:mT+ih-Y(r.obj), fill:"var(--sem-na)", rx:3}));
    svg.appendChild(el("rect",{x:cx+bw*0.02, y:Y(r.real), width:bw*0.30, height:mT+ih-Y(r.real), fill:"var(--s1)", rx:3}));
    svg.appendChild(el("text",{class:"axis",x:cx,y:H-mB+16,"text-anchor":"middle","font-weight":600,fill:"var(--ink-2)"}, "M"+r.mc));
    if(r.obj){
      const pct=r.real/r.obj*100;
      const col = pct<90?"var(--sem-corto)": pct<=110?"var(--sem-ok)": pct<=120?"var(--sem-pasado)":"var(--sem-alto)";
      svg.appendChild(el("text",{x:cx, y:Y(Math.max(r.real,r.obj))-6, "text-anchor":"middle", "font-size":11, "font-weight":700, fill:col}, Math.round(pct)+"%"));
    }
  });
  const box=el("div",{class:"chart-box"}); box.appendChild(svg); p.appendChild(box);

  // table
  const wrap=el("div",{class:"tbl-scroll"});
  const tb=el("table");
  tb.innerHTML=`<thead><tr><th>Microciclo</th><th>Tipo</th><th>Sesiones</th><th>Objetivo</th><th>Real</th><th>Cumpl.</th></tr></thead>`;
  const body=el("tbody");
  rows.forEach(r=>{
    const pct=r.obj? r.real/r.obj*100 : null;
    body.appendChild(el("tr",{},[
      el("td",{},"Microciclo "+r.mc),
      el("td",{},r.tipo||"–"),
      el("td",{class:"mono"},String(r.n)),
      el("td",{class:"mono"},fmtN(r.obj,0)),
      el("td",{class:"mono"},fmtN(r.real,0)),
      el("td",{class:"mono"},pct!=null?Math.round(pct)+"%":"–"),
    ]));
  });
  tb.appendChild(body); wrap.appendChild(tb); p.appendChild(wrap);
  root.appendChild(p);
}

/* ===== 3 · TIPO DE SESIÓN ===== */
function viewTipo(root){
  const M=METRICS[state.metric];
  const p=panel("Distribución por tipo de sesión",
    `${M.lab} · ${NORMS[state.norm].lab.toLowerCase()} — cada punto es una sesión (media del equipo). La caja es media ± desviación. Sirve para ver si cada MD-x se repite con consistencia. Los microciclos 1–7 (pretemporada) van agrupados en «Pretemp.» y no cuentan como MD-x.`);

  const cats = BUCKET_ORDER.filter(b=> state.buckets.has(b) && RAW.sessions.some(s=>s.bucket===b));
  const data = cats.map(c=>{
    const vals = RAW.sessions.filter(s=>s.bucket===c)
      .map(s=>({v:teamPoint(s, state.metric, state.norm), key:s.key, mc:s.mc}))
      .filter(o=>o.v!=null && isFinite(o.v));
    const arr=vals.map(o=>o.v);
    const mean=arr.reduce((a,b)=>a+b,0)/(arr.length||1);
    const sd=Math.sqrt(arr.reduce((a,b)=>a+(b-mean)**2,0)/(arr.length||1));
    return {c, vals, mean:arr.length?mean:null, sd, cv: mean? sd/mean*100 : null};
  }).filter(d=>d.vals.length);

  if(!data.length){ p.appendChild(el("p",{class:"note"},"Sin datos.")); root.appendChild(p); return; }

  const W=980,H=360,mL=54,mR=16,mT=18,mB=44;
  const iw=W-mL-mR, ih=H-mT-mB;
  const all=data.flatMap(d=>d.vals.map(o=>o.v));
  let vmin=Math.min(...all), vmax=Math.max(...all);
  const ticks=niceTicks(state.norm==="abs"?Math.min(0,vmin):vmin, vmax, 5);
  vmin=ticks[0]; vmax=ticks[ticks.length-1];
  const Y=v=> mT+ih - ih*(v-vmin)/(vmax-vmin);
  const bw=iw/data.length;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"Distribución por tipo de sesión"});
  const g=el("g",{class:"grid"});
  ticks.forEach(tk=>g.appendChild(el("line",{x1:mL,x2:W-mR,y1:Y(tk),y2:Y(tk)})));
  svg.appendChild(g);
  const ax=el("g",{class:"axis"});
  ticks.forEach(tk=>ax.appendChild(el("text",{x:mL-8,y:Y(tk)+3.5,"text-anchor":"end"}, fmtN(tk, state.norm==="permin"?1:0))));
  ax.appendChild(el("text",{class:"axis-lab",x:mL-40,y:mT-4}, unitLabel()));
  svg.appendChild(ax);

  data.forEach((d,i)=>{
    const cx=mL+bw*i+bw/2;
    if(d.mean!=null && d.sd>0){
      svg.appendChild(el("rect",{x:cx-26, y:Y(d.mean+d.sd), width:52, height:Math.max(1,Y(d.mean-d.sd)-Y(d.mean+d.sd)), fill:"var(--s1)", opacity:.13, rx:4}));
      svg.appendChild(el("line",{x1:cx-28,x2:cx+28,y1:Y(d.mean),y2:Y(d.mean), stroke:"var(--s1)","stroke-width":2}));
    }
    d.vals.forEach((o,k)=>{
      const jx=cx + ((k%5)-2)*7;
      svg.appendChild(el("circle",{cx:jx, cy:Y(o.v), r:3.2, fill:"var(--ink)", opacity:.55, class:"dot"}));
    });
    svg.appendChild(el("text",{class:"axis",x:cx,y:H-mB+16,"text-anchor":"middle","font-weight":600,fill:"var(--ink-2)"}, d.c));
    if(d.cv!=null) svg.appendChild(el("text",{x:cx,y:H-mB+30,"text-anchor":"middle","font-size":10,fill:"var(--ink-3)"}, "CV "+Math.round(d.cv)+"%"));
  });
  const box=el("div",{class:"chart-box"}); box.appendChild(svg); p.appendChild(box);
  p.appendChild(el("p",{class:"note"},"CV = coeficiente de variación (desviación / media). Cuanto más bajo, más estandarizada está esa tipología de sesión entre microciclos."));
  root.appendChild(p);
}

/* ===== 3b · PARTIDOS OFICIALES ===== */
function viewPartidos(root){
  const M=METRICS[state.metric];
  const p=panel("Partidos oficiales",
    "Liga 2026-27 — acumulado de cada partido oficial (los amistosos de pretemporada no cuentan aquí). Media = por jugador que lo disputó · Suma = total del equipo en ese partido.");

  const all = officialMatches();
  const rows = all
    .map(s=>({ s, stats: Object.fromEntries([...RADAR_METRICS,"pl","vmax"].map(k=>[k, matchStat(s,k)])) }))
    .filter(r=> r.stats.distancia.n>0);
  const pending = all.filter(s=> matchStat(s,"distancia").n===0);

  if(!rows.length){
    if(pending.length){
      const pm=pending[0], note=el("p",{class:"note"});
      note.append("Aún no hay datos de partidos oficiales. Próximo: "+pm.key+" vs "+(pm.rival||"?")+" ("+pm.date.slice(5)+") — ");
      note.appendChild(el("span",{class:"badge-pend"},"Pendiente"));
      p.appendChild(note);
    } else p.appendChild(el("p",{class:"note"},"Sin partidos oficiales todavía."));
    root.appendChild(p); return;
  }

  // mini-KPIs
  const distTotal = rows.reduce((a,r)=>a+(r.stats.distancia.sum||0),0);
  const hsrTotal = rows.reduce((a,r)=>a+(r.stats.hsr.sum||0),0);
  const usados = new Set(); rows.forEach(r=> r.s.players.forEach(pr=>{ if(raw(pr,"distancia").real!=null) usados.add(pr.d); }));
  const miniData=[
    {n:rows.length, l:"Partidos oficiales"},
    {n:fmtN(distTotal,0), sm:" m", l:"Distancia total"},
    {n:fmtN(hsrTotal,0), sm:" m", l:"HSR total"},
    {n:usados.size, l:"Jugadores utilizados"},
  ];
  const mini=el("div",{class:"mini-kpis"});
  mini.innerHTML = miniData.map(k=>`<div class="kpi"><div class="n">${k.n}${k.sm?`<small>${k.sm}</small>`:""}</div><div class="l">${k.l}</div></div>`).join("");
  p.appendChild(mini);

  // gráfica: total (suma) del parámetro elegido, partido a partido
  const vals = rows.map(r=> r.stats[state.metric].sum);
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const W=980,H=320,mL=58,mR=16,mT=16,mB=46;
  const iw=W-mL-mR, ih=H-mT-mB;
  const vmax=Math.max(...vals)*1.18 || 1;
  const ticks=niceTicks(0,vmax,5);
  const Y=v=> mT+ih - ih*v/ticks[ticks.length-1];
  const bw=iw/rows.length;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"Total por partido oficial"});
  const g=el("g",{class:"grid"});
  ticks.forEach(tk=>g.appendChild(el("line",{x1:mL,x2:W-mR,y1:Y(tk),y2:Y(tk)})));
  svg.appendChild(g);
  const ax=el("g",{class:"axis"});
  ticks.forEach(tk=>ax.appendChild(el("text",{x:mL-8,y:Y(tk)+3.5,"text-anchor":"end"}, fmtN(tk,0))));
  ax.appendChild(el("text",{class:"axis-lab",x:mL-44,y:mT-4}, M.u||"u"));
  svg.appendChild(ax);
  svg.appendChild(el("line",{class:"band-line", x1:mL, x2:W-mR, y1:Y(avg), y2:Y(avg)}));
  svg.appendChild(el("text",{x:W-mR,y:Y(avg)-5,"text-anchor":"end","font-size":10,fill:"var(--ink-3)"}, "media temporada · "+fmtN(avg,0)));
  rows.forEach((r,i)=>{
    const cx=mL+bw*i+bw/2, v=r.stats[state.metric].sum;
    svg.appendChild(el("rect",{x:cx-bw*0.32, y:Y(v), width:bw*0.64, height:mT+ih-Y(v), fill:"var(--s1)", rx:3}));
    svg.appendChild(el("text",{x:cx,y:Y(v)-6,"text-anchor":"middle","font-size":11,"font-weight":700,fill:"var(--ink)"}, fmtN(v,0)));
    svg.appendChild(el("text",{class:"axis",x:cx,y:H-mB+16,"text-anchor":"middle","font-weight":600,fill:"var(--ink-2)"}, r.s.key));
    svg.appendChild(el("text",{class:"axis",x:cx,y:H-mB+29,"text-anchor":"middle"}, "vs "+(r.s.rival||"?")));
  });
  const box=el("div",{class:"chart-box"}); box.appendChild(svg); p.appendChild(box);

  if(pending.length){
    const pm=pending[0], note=el("p",{class:"note"});
    note.append("Próximo: "+pm.key+" vs "+(pm.rival||"?")+" ("+pm.date.slice(5)+") — ");
    note.appendChild(el("span",{class:"badge-pend"},"Pendiente"));
    p.appendChild(note);
  }

  // tabla completa: media + sumatorio de cada parámetro, partido a partido + acumulado
  const TABLE_METRICS=["distancia","hmld","hsr","sprint","acc","dec","pl"];
  const wrap=el("div",{class:"tbl-scroll sticky-col"});
  const tb=el("table");
  const head1=['<th rowspan="2">Partido</th>']
    .concat(TABLE_METRICS.map(k=>`<th colspan="2" class="grp-start">${METRICS[k].lab}${METRICS[k].u?` (${METRICS[k].u})`:""}</th>`))
    .concat(['<th rowspan="2" class="grp-start">Vel. máx<br>mejor</th>']).join("");
  const head2=TABLE_METRICS.map(()=>'<th class="grp-start">Media</th><th>Suma</th>').join("");
  tb.innerHTML=`<thead><tr>${head1}</tr><tr>${head2}</tr></thead>`;
  const body=el("tbody");
  rows.forEach(r=>{
    const cells=[`<td>${r.s.key} <span class="muted">vs ${r.s.rival||"?"}</span><br><span class="muted">${r.s.date.slice(5)}</span></td>`];
    TABLE_METRICS.forEach(k=>{
      const st=r.stats[k];
      cells.push(`<td class="mono grp-start">${st.mean!=null?fmtN(st.mean,METRICS[k].dec):"–"}</td>`);
      cells.push(`<td class="mono">${st.sum!=null?fmtN(st.sum,0):"–"}</td>`);
    });
    cells.push(`<td class="mono grp-start">${r.stats.vmax.best!=null?fmtN(r.stats.vmax.best,1):"–"}</td>`);
    const tr=el("tr"); tr.innerHTML=cells.join(""); body.appendChild(tr);
  });
  const totCells=["<td>ACUMULADO TEMPORADA</td>"];
  TABLE_METRICS.forEach(k=>{
    const sum=rows.reduce((a,r)=>a+(r.stats[k].sum||0),0);
    const totalN=rows.reduce((a,r)=>a+r.stats[k].n,0);
    const mean=totalN? sum/totalN : null;
    totCells.push(`<td class="mono grp-start">${mean!=null?fmtN(mean,METRICS[k].dec):"–"}</td>`);
    totCells.push(`<td class="mono">${fmtN(sum,0)}</td>`);
  });
  const bestVmax=Math.max(...rows.map(r=>r.stats.vmax.best||0));
  totCells.push(`<td class="mono grp-start">${bestVmax?fmtN(bestVmax,1):"–"}</td>`);
  const trTot=el("tr",{class:"total"}); trTot.innerHTML=totCells.join(""); body.appendChild(trTot);
  tb.appendChild(body); wrap.appendChild(tb); p.appendChild(wrap);
  p.appendChild(el("p",{class:"note"},"La media de la fila «Acumulado» pondera por participación: es el sumatorio de la temporada entre el total de jugadores-partido, no la media simple de las medias de cada partido."));
  root.appendChild(p);
}

/* ===== 4 · JUGADORES ===== */
function viewJugadores(root){
  const p=panel("Mapa de jugadores",
    "Media de la temporada de cada jugador frente a su objetivo individual, por métrica. Verde = en objetivo, azul = por debajo, ámbar/rojo = por encima. Pulsa una fila para ver la ficha.");
  p.appendChild(legendRow([
    {c:"var(--sem-corto)",t:"< 90% obj."},{c:"var(--sem-ok)",t:"90–110%"},
    {c:"var(--sem-pasado)",t:"110–120%"},{c:"var(--sem-alto)",t:"> 120%"},
  ]));

  const cols=RADAR_METRICS;
  const players=PLAYERS.filter(pl=> state.group==="all" || pl.g===state.group);
  const cell=(dorsal,m)=>{
    let real=0,obj=0,n=0;
    RAW.sessions.forEach(s=>{ if(s.isMatch||!state.buckets.has(s.bucket)) return;
      const pr=s.players.find(x=>x.d===dorsal); if(!pr) return;
      const c=raw(pr,m); if(c.obj!=null && c.real!=null){ real+=c.real; obj+=c.obj; n++; }
    });
    return n? {pct:real/obj*100, n} : null;
  };
  const colOf=pct=> pct==null?"var(--sem-na)": pct<90?"var(--sem-corto)": pct<=110?"var(--sem-ok)": pct<=120?"var(--sem-pasado)":"var(--sem-alto)";

  const wrap=el("div",{class:"tbl-scroll"});
  const tb=el("table");
  tb.innerHTML=`<thead><tr><th>Jugador</th><th>Pos</th>${cols.map(c=>`<th>${METRICS[c].lab}</th>`).join("")}</tr></thead>`;
  const body=el("tbody");
  players.forEach(pl=>{
    const tr=el("tr",{style:"cursor:pointer"});
    tr.appendChild(el("td",{},[el("span",{},"#"+pl.d+" "),document.createTextNode(pl.n)]));
    tr.appendChild(el("td",{class:"pos-"+pl.g}, GROUPS[pl.g]||pl.g));
    cols.forEach(m=>{
      const c=cell(pl.d,m);
      const td=el("td",{class:"hm-cell", style:`background:${colOf(c?.pct)}; color:#fff`});
      td.innerHTML=`<span class="hm-val">${c?Math.round(c.pct)+"%":"–"}</span>`;
      tr.appendChild(td);
    });
    tr.onclick=()=>{ state.hmPlayer=pl.d; renderView(); };
    body.appendChild(tr);
  });
  tb.appendChild(body); wrap.appendChild(tb); p.appendChild(wrap);
  root.appendChild(p);

  if(state.hmPlayer!=null){
    const pl=PLAYERS.find(x=>x.d===state.hmPlayer);
    const dp=panel("Ficha · "+(pl?pl.n:""), "Perfil medio del jugador (por minuto) frente a la media del equipo, y su registro por tipo de sesión.");
    const grid=el("div",{class:"split", style:"padding:4px 16px 18px"});

    // radar
    const rd=el("div");
    rd.appendChild(el("p",{class:"sub-h"},"Perfil por minuto vs equipo"));
    rd.appendChild(radarChart([
      {label:"Equipo", color:"var(--ink-3)", vals:RADAR_METRICS.map(m=> teamMeanPerMin(m, null))},
      {label:pl.n.split(",")[0], color:"var(--s1)", vals:RADAR_METRICS.map(m=> teamMeanPerMin(m, new Set([pl.d])))},
    ], RADAR_METRICS.map(m=>METRICS[m].lab)));
    grid.appendChild(rd);

    // per-bucket table
    const bt=el("div");
    bt.appendChild(el("p",{class:"sub-h"},"Cumplimiento por tipo de sesión"));
    const t=el("table");
    t.innerHTML=`<thead><tr><th>Tipo</th><th>Sesiones</th><th>${METRICS[state.metric].lab}</th><th>% obj.</th></tr></thead>`;
    const tbody=el("tbody");
    BUCKET_ORDER.filter(b=>b!=="Partido").forEach(bk=>{
      const ss=RAW.sessions.filter(s=>s.bucket===bk && !s.isMatch);
      let real=0,obj=0,n=0,val=0,vn=0;
      ss.forEach(s=>{ const pr=s.players.find(x=>x.d===pl.d); if(!pr) return;
        const c=raw(pr,state.metric);
        if(c.real!=null){ val+=normalize(c.real,state.norm,pr,state.metric)||0; vn++; }
        if(c.obj!=null&&c.real!=null){ real+=c.real; obj+=c.obj; n++; }
      });
      if(!vn) return;
      const pct=obj?real/obj*100:null;
      tbody.appendChild(el("tr",{},[
        el("td",{},bk),
        el("td",{class:"mono"},String(vn)),
        el("td",{class:"mono"},fmtN(val/vn, state.norm==="permin"?2:0)),
        el("td",{class:"mono", style:pct!=null?`color:${colOf(pct)}`:""}, pct!=null?Math.round(pct)+"%":"–"),
      ]));
    });
    t.appendChild(tbody); bt.appendChild(t); grid.appendChild(bt);
    dp.appendChild(grid);
    root.appendChild(dp);
  }
}
function teamMeanPerMin(metric, dorsalSet){
  let sum=0,n=0;
  RAW.sessions.forEach(s=>{ if(s.isMatch) return;
    s.players.forEach(pr=>{
      if(dorsalSet){ if(!dorsalSet.has(pr.d)) return; } else if(!inGroup(pr)) return;
      const c=raw(pr,metric); if(c.real!=null && pr.dur){ sum+=c.real/pr.dur; n++; }
    });
  });
  return n? sum/n : 0;
}

/* ===== 5 · COMPARADOR ===== */
function viewComparador(root){
  const p=panel("Comparador de jugadores",
    "Elige de 2 a 5 jugadores y superpón su perfil medio (por minuto) y su cumplimiento de objetivo de la temporada.");
  const pick=el("div",{class:"pick"});
  PLAYERS.forEach(pl=>{
    const on=state.players.has(pl.d);
    const b=el("button",{class:"chip sm","aria-pressed":on},"#"+pl.d+" "+pl.n.split(",")[0]);
    b.onclick=()=>{ on?state.players.delete(pl.d):(state.players.size<5&&state.players.add(pl.d)); renderView(); };
    pick.appendChild(b);
  });
  p.appendChild(pick);

  const chosen=[...state.players];
  if(chosen.length<2){ p.appendChild(el("p",{class:"note"},"Selecciona al menos 2 jugadores.")); root.appendChild(p); return; }

  p.appendChild(legendRow(chosen.map((d,i)=>({c:SERIES_COLORS[i%6], t:NAME[d].split(",")[0], line:true}))));
  const series=chosen.map((d,i)=>({
    label:NAME[d].split(",")[0], color:SERIES_COLORS[i%6],
    vals:RADAR_METRICS.map(m=> teamMeanPerMin(m, new Set([d]))),
  }));
  const box=el("div",{style:"padding:4px 16px 8px; max-width:560px; margin:0 auto"});
  box.appendChild(radarChart(series, RADAR_METRICS.map(m=>METRICS[m].lab)));
  p.appendChild(box);

  const wrap=el("div",{class:"tbl-scroll"});
  const t=el("table");
  t.innerHTML=`<thead><tr><th>Métrica (por min)</th>${chosen.map(d=>`<th>${NAME[d].split(",")[0]}</th>`).join("")}</tr></thead>`;
  const tbody=el("tbody");
  RADAR_METRICS.forEach((m,r)=>{
    tbody.appendChild(el("tr",{},[
      el("td",{},METRICS[m].lab),
      ...series.map(s=> el("td",{class:"mono"}, fmtN(s.vals[r],2))),
    ]));
  });
  t.appendChild(tbody); wrap.appendChild(t); p.appendChild(wrap);
  root.appendChild(p);
}

/* ---------- radar ---------- */
function radarChart(series, labels){
  const N=labels.length, W=440,H=360,cx=W/2,cy=H/2+6,R=118;
  const maxes=labels.map((_,i)=> Math.max(...series.map(s=>s.vals[i]||0))*1.15 || 1);
  const ang=i=> -Math.PI/2 + i*2*Math.PI/N;
  const pt=(i,val)=>[cx+Math.cos(ang(i))*R*(val/maxes[i]), cy+Math.sin(ang(i))*R*(val/maxes[i])];
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"Gráfica radar"});
  [0.25,0.5,0.75,1].forEach(f=>{
    const d=labels.map((_,i)=>{ const p=[cx+Math.cos(ang(i))*R*f, cy+Math.sin(ang(i))*R*f]; return p.join(","); }).join(" L");
    svg.appendChild(el("path",{d:"M"+d+" Z", fill:"none", stroke:"var(--border)","stroke-width":1}));
  });
  labels.forEach((lab,i)=>{
    const o=[cx+Math.cos(ang(i))*R, cy+Math.sin(ang(i))*R];
    svg.appendChild(el("line",{x1:cx,y1:cy,x2:o[0],y2:o[1], stroke:"var(--border)","stroke-width":1}));
    const lx=cx+Math.cos(ang(i))*(R+22), ly=cy+Math.sin(ang(i))*(R+22);
    svg.appendChild(el("text",{x:lx, y:ly+3, "text-anchor": Math.abs(lx-cx)<8?"middle":(lx>cx?"start":"end"), "font-size":10.5, fill:"var(--ink-2)"}, lab));
  });
  series.forEach(s=>{
    const d=s.vals.map((v,i)=> pt(i,v).join(",")).join(" L");
    svg.appendChild(el("path",{d:"M"+d+" Z", fill:s.color, "fill-opacity":.12, stroke:s.color, "stroke-width":2}));
    s.vals.forEach((v,i)=>{ const q=pt(i,v); svg.appendChild(el("circle",{cx:q[0],cy:q[1],r:2.6,fill:s.color})); });
  });
  return svg;
}
